<!-- ============ 字体（本地自托管，离线可用；故障时回退系统字体） ============ -->
<link rel="stylesheet" href="assets/fonts/fonts.css">

<style>
/* ==========================================================================
   视觉系统 / Visual System
   《轻音少女》樱丘高中氛围配色 + 极淡樱花纹理 + 音符装饰元素
   ========================================================================== */
:root{
  --sakura:#FFB7C5; --sakura2:#FF8FAA; --tea:#8B7355; --cream:#FFF8E7;
  --mizu:#A8D8EA; --berry:#FF6B8A; --matcha:#9DC08B; --lemon:#FFE599;
  --cocoa:#5D4E37; --warm:#F5F0E6; --clay:#D4C8B8; --ink:#4A4A4A;
  --player:#3A2F27;
  --bg:#FFF8E7; --card:#FFFFFF; --line:#EAD9C4; --nav-bg:rgba(255,248,231,.82);
  --txt:#4A4A4A; --txt-2:#7A6A55; --shadow:0 10px 30px -12px rgba(93,78,55,.18);
  --radius:18px;
}
/* 夜间模式：自动降低亮度、换深棕底 */
[data-theme="dark"]{
  --bg:#2B231E; --card:#3A2F27; --line:#56483A; --nav-bg:rgba(43,35,30,.86);
  --txt:#F5F0E6; --txt-2:#D4C8B8; --shadow:0 10px 30px -12px rgba(0,0,0,.5);
  --warm:#3A2F27; --clay:#56483A;
}

/* ---------- 基础 ---------- */
html{scroll-behavior:smooth}html,body{overflow-x:hidden;padding-bottom:104px}
body{
  font-family:'Noto Sans SC','Zen Maru Gothic',system-ui,sans-serif;
  background:var(--bg); color:var(--txt); line-height:1.6;
  /* 极淡樱花纹理：多层径向渐变模拟花瓣散布 + 轻微视差由 JS 控制 transform */
  background-image:
    radial-gradient(circle at 8% 12%, rgba(255,183,197,.16) 0 9px, transparent 10px),
    radial-gradient(circle at 88% 6%, rgba(168,216,234,.15) 0 12px, transparent 13px),
    radial-gradient(circle at 72% 38%, rgba(255,229,153,.14) 0 8px, transparent 9px),
    radial-gradient(circle at 22% 64%, rgba(255,183,197,.12) 0 11px, transparent 12px),
    radial-gradient(circle at 55% 88%, rgba(157,192,139,.12) 0 9px, transparent 10px),
    radial-gradient(circle at 38% 26%, rgba(255,183,197,.10) 0 7px, transparent 8px),
    radial-gradient(circle at 93% 72%, rgba(255,183,197,.12) 0 10px, transparent 11px);
  background-size: 900px 900px, 1100px 1100px, 1000px 1000px, 950px 950px, 1050px 1050px, 900px 900px, 1000px 1000px;
  background-attachment: fixed; /* 花瓣纹理随滚动产生轻微视差 */
  transition: background-color .4s, color .4s;
  padding-bottom: 148px; /* 给底部常驻播放器留空间 */
}
::selection{background:#FFB7C5; color:#5D4E37}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D4C8B8;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--sakura2); outline-offset:2px}

/* 日文假名标注：中文在上方用小号假名（ruby 实现） */
.ruby{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;text-align:center}
.ruby rt{font-size:.42em;font-weight:500;color:var(--sakura2);letter-spacing:.05em}
.ruby .zh{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-weight:900}

/* ---------- 加载动画：平泽唯抱着吉他跑步（纯 CSS 小人，可替换为真实动图） ---------- */
#loader{position:fixed;inset:0;z-index:100;background:#FFF8E7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
[data-theme="dark"] #loader{background:#2B231E}
#loader.hide{opacity:0;pointer-events:none}
.loader-girl{position:relative;width:120px;height:90px}
.loader-girl .head{position:absolute;left:44px;top:6px;width:26px;height:26px;border-radius:50%;background:#F2C9A0;animation:runBounce 1s infinite}
.loader-girl .hair{position:absolute;left:36px;top:2px;width:20px;height:30px;border-radius:60% 40% 40% 60%;background:#C9895F;animation:runBounce 1s infinite}
.loader-girl .body{position:absolute;left:38px;top:32px;width:34px;height:26px;border-radius:10px;background:#FFB7C5}
.loader-girl .leg{position:absolute;top:56px;width:7px;height:22px;background:#8B7355;border-radius:4px;animation:runLeg .5s infinite alternate}
.loader-girl .leg.l1{left:44px}.loader-girl .leg.l2{left:60px;animation-delay:.25s}
.loader-girl .guitar{position:absolute;left:12px;top:30px;width:46px;height:18px;background:#A06A3B;border-radius:8px 4px 4px 8px;transform:rotate(-12deg);animation:runBounce 1s infinite}
.loader-girl .guitar:after{content:'';position:absolute;right:-7px;top:3px;width:9px;height:9px;border-radius:50%;background:#5D4E37}
@keyframes runBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes runLeg{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.loader-note{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;color:#5D4E37;font-size:20px;letter-spacing:.1em}
[data-theme="dark"] .loader-note{color:#F5F0E6}

/* ---------- 樱花飘落（15-20 片，速度随机，不遮挡内容：pointer-events none） ---------- */
#petals{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.petal{position:absolute;top:-6%;width:14px;height:14px;opacity:.55;filter:saturate(1.1);animation:fall linear infinite;will-change:transform}
.petal svg{width:100%;height:100%;display:block}
@keyframes fall{
  0%{transform:translate3d(0,-5vh,0) rotate(0deg)}
  100%{transform:translate3d(30vw,108vh,0) rotate(360deg)}
}
/* 播放时的音符上浮动画 */
#float-notes{position:fixed;inset:0;pointer-events:none;z-index:6}
.float-note{position:absolute;font-size:16px;color:var(--sakura2);opacity:.7;animation:noteUp 2.8s ease-out forwards}
@keyframes noteUp{0%{transform:translateY(20px) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translateY(-90px) scale(1.15);opacity:0}}

/* ---------- 顶部导航 ---------- */
#topnav{position:fixed;top:0;left:0;right:0;z-index:50;transition:all .35s}
#topnav.scrolled{background:var(--nav-bg);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 4px 24px rgba(93,78,55,.12)}
.nav-link{position:relative;font-weight:700;color:var(--txt);transition:color .2s}
.nav-link:hover,.nav-link.active{color:var(--sakura2)}
.nav-link.active:after{content:'';position:absolute;left:20%;right:20%;bottom:-4px;height:3px;border-radius:3px;background:var(--sakura2)}
/* 二级下拉菜单 */
.dropdown{position:relative}
.dropdown-menu{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(6px);min-width:180px;max-height:calc(100vh - 140px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:all .22s;padding:8px}
.dropdown:hover .dropdown-menu,.dropdown:focus-within .dropdown-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.dropdown-menu a{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--txt);font-weight:600}
.dropdown-menu a:hover{background:var(--warm);color:var(--sakura2)}
.dropdown-menu a .di{width:16px;text-align:center}

/* 移动端抽屉 */
#mnav{position:fixed;top:0;right:0;width:280px;height:100vh;background:var(--card);z-index:60;display:none;box-shadow:-10px 0 30px rgba(0,0,0,.15);overflow-y:auto;transform:translateX(100%);transition:transform .3s}
#mnav.open{display:block;transform:translateX(0)}
#mn-cover{position:fixed;inset:0;background:rgba(43,35,30,.4);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
#mn-cover.show{opacity:1;pointer-events:auto}

/* ---------- 按钮通用：悬停放大 1.05 + 阴影加深 + 小音符跳动 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:999px;transition:transform .18s ease, box-shadow .18s ease, background .2s;cursor:pointer;position:relative;user-select:none}
.btn:hover{transform:scale(1.05);box-shadow:0 10px 22px -8px rgba(255,107,138,.55)}
.btn:active{transform:scale(.97)}
.btn-note:hover:after{content:'♪';position:absolute;right:-6px;top:-12px;font-size:16px;color:var(--berry);animation:notePop .5s ease}
@keyframes notePop{0%{opacity:0;transform:translateY(4px) rotate(-8deg)}60%{opacity:1}100%{opacity:0;transform:translateY(-12px) rotate(10deg)}}
.btn-berry{background:#FF6B8A;color:#fff}
.btn-berry:hover{background:#FF5678}
.btn-cream{background:var(--cream);color:var(--cocoa);border:1.5px solid var(--clay)}
.btn-ghost{background:transparent;color:var(--txt);border:1.5px solid var(--clay)}
.btn-dark{background:var(--cocoa);color:#FFF8E7}

/* ---------- 卡片 ---------- */
.kcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .25s ease, box-shadow .25s ease;position:relative;overflow:hidden}
.kcard:hover{transform:translateY(-4px);box-shadow:0 18px 38px -14px rgba(93,78,55,.3)}
/* 卡片角落乐器小图标 */
.kcard .corner-ic{position:absolute;right:10px;top:10px;width:26px;height:26px;opacity:.18;pointer-events:none}
.kcard:hover .corner-ic{opacity:.45;transition:opacity .3s}

/* 音符虚线分隔线 */
.note-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px 0;color:var(--sakura2);font-size:15px;letter-spacing:8px;user-select:none}

/* ---------- Banner 轮播 ---------- */
#banner{position:relative;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
#banner .slides{display:flex;transition:transform .6s cubic-bezier(.22,1,.36,1)}
#banner .slide{min-width:100%;position:relative}
.banner-ph{position:relative;overflow:hidden;height:min(46vh,400px)}
@media(max-width:640px){.banner-ph{height:40vh}}
.banner-ph .ph-inner{position:absolute;inset:0}
.banner-caption{position:absolute;left:6%;bottom:10%;color:#FFF;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.banner-caption .ja{font-family:'Zen Maru Gothic','Noto Sans SC',sans-serif;font-size:clamp(20px,3.2vw,42px);font-weight:900;text-shadow:0 2px 14px rgba(93,78,55,.45);white-space:nowrap}
.banner-caption .zh{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-size:clamp(14px,1.9vw,21px);opacity:.95;text-shadow:0 1px 8px rgba(93,78,55,.4)}
#banner .dots{position:absolute;bottom:14px;right:18px;display:flex;gap:8px;z-index:4}
#banner .dots button{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.55);transition:all .25s;cursor:pointer;position:relative}#banner .dots button::after{content:'';position:absolute;inset:-10px}
#banner .dots button.on{background:#FF6B8A;width:28px;border-radius:6px}
#banner .navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:42px;height:42px;border-radius:50%;background:rgba(255,248,231,.85);color:#5D4E37;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s, background .2s}
#banner .navbtn:hover{transform:translateY(-50%) scale(1.08);background:#fff}
#banner .navbtn.prev{left:16px}#banner .navbtn.next{right:16px}

/* ---------- 时间轴（grid 三列：时间/轴/内容，像素级对齐） ---------- */
.tl{display:grid;grid-template-columns:110px 26px 1fr;gap:0;row-gap:0}
.tl .t-time{text-align:right;padding:6px 14px 6px 0;font-weight:700;color:var(--tea);font-size:14px;line-height:1.4}
.tl .t-axis{position:relative;display:flex;justify-content:center;padding:6px 0}
.tl .t-axis:before{content:'';position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(var(--sakura2),var(--mizu));left:50%;transform:translateX(-50%)}
.tl .t-dot{width:13px;height:13px;border-radius:50%;background:#FF6B8A;border:3px solid var(--card);z-index:1;box-shadow:0 0 0 2px #FFB7C5;justify-self:center;align-self:start;margin-top:7px}
.tl .t-body{padding:2px 0 20px 16px}
@media(max-width:640px){.tl{grid-template-columns:84px 22px 1fr}}

/* ---------- 歌词三行对照 ---------- */
.lyric-line{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:10px;padding:7px 14px;border-radius:12px;transition:all .25s;font-size:14px}
.lyric-line .ja{font-family:'Zen Maru Gothic',sans-serif;text-align:right}
.lyric-line .zh{text-align:center;color:var(--txt-2)}
.lyric-line .ro{text-align:left;color:var(--tea);font-size:12px;font-family:ui-monospace,monospace}
.lyric-line.active{background:rgba(255,183,197,.22);outline:1.5px solid rgba(255,111,138,.35)}
.lyric-line.active .ja{color:var(--sakura2);font-weight:900;font-size:16px}
.lyric-line.past{opacity:.55}

/* ---------- 瀑布流图库 ---------- */
.wf{columns:4;column-gap:14px}
@media(max-width:1024px){.wf{columns:3}}
@media(max-width:640px){.wf{columns:2}}
.wf .wf-item{break-inside:avoid;margin-bottom:14px}

/* ---------- 表格列宽显式控制 ---------- */
table.fix{table-layout:fixed;width:100%;border-collapse:collapse}
table.fix th,table.fix td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 全局底部播放器 ---------- */
#player{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--player);color:#F5E9DA;box-shadow:0 -8px 30px rgba(0,0,0,.3);transition:transform .3s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#player.collapsed #player-panel{display:none}
/* 呼吸灯：播放时边框樱粉呼吸 */
/* 播放中：静态渐变描边（不再做 opacity 呼吸动画，避免整条播放器闪烁） */
#player.playing{border-top:2px solid transparent;background-image:linear-gradient(var(--player),var(--player)),linear-gradient(90deg,#FFB7C5,#FF6B8A,#FFE599,#A8D8EA);background-origin:border-box;background-clip:content-box,border-box}
#player:not(.playing){border-top:1px solid #56483A}
#player .cover{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#FFB7C5,#A8D8EA);display:flex;align-items:center;justify-content:center;color:#5D4E37;font-size:20px;flex-shrink:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
#player input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:#56483A;outline:none}
#player input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#FF6B8A;border:2px solid #FFF8E7;cursor:pointer}
#player input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#FF6B8A;border:2px solid #FFF8E7;cursor:pointer}
.pbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#F5E9DA;transition:all .18s;cursor:pointer;font-size:17px}
.pbtn:hover{background:rgba(255,183,197,.18);color:#FFB7C5;transform:scale(1.1)}
.pbtn.main{width:52px;height:52px;background:#FF6B8A;color:#fff;font-size:20px;box-shadow:0 4px 16px rgba(255,107,138,.45)}
.pbtn.main:hover{background:#FF5678;color:#fff}
@media (max-width:640px){
  #logo{min-height:44px}
  #topnav .pbtn{width:44px;height:44px}
  .pbtn{width:44px;height:44px}
  #banner .navbtn{width:44px;height:44px}
  .mode-badge{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .btn-berry,.btn-cream{min-height:44px}
  input[type=text],input[type=search],textarea{font-size:16px}
}
.pbtn.on{color:#FFB7C5;background:rgba(255,183,197,.16)}
.mode-badge{font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(255,183,197,.16);color:#FFD3DC;cursor:pointer;transition:all .2s}
.mode-badge:hover{background:rgba(255,183,197,.3)}
/* 歌词面板（展开状态） */
#player-panel{max-height:46vh;overflow-y:auto;border-top:1px solid #56483A}
.panel-tab{flex:1;text-align:center;padding:10px;font-weight:700;color:#D4C8B8;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-size:14px}
.panel-tab.on{color:#FFB7C5;border-bottom-color:#FF6B8A;background:rgba(255,183,197,.08)}
.panel-tab:hover{color:#FFD3DC}
.queue-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;cursor:pointer;transition:background .2s}
.queue-item:hover{background:rgba(255,255,255,.07)}
.queue-item.playing{background:rgba(255,183,197,.15)}
.queue-item.playing .q-name{color:#FFB7C5}

/* 桌面悬浮歌词（半透明） */
#desk-lyrics{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);z-index:69;background:rgba(58,47,39,.72);backdrop-filter:blur(8px);padding:12px 26px;border-radius:16px;border:1px solid rgba(255,183,197,.35);max-width:min(680px,90vw);text-align:center;display:none;pointer-events:none}
#desk-lyrics .dl-ja{font-family:'Zen Maru Gothic',sans-serif;font-size:19px;font-weight:900;color:#FFB7C5}
#desk-lyrics .dl-zh{font-size:13px;color:#F5E9DA;margin-top:3px}

/* ---------- 搜索覆盖层 ---------- */
#search-ov{position:fixed;inset:0;z-index:80;background:rgba(43,35,30,.5);backdrop-filter:blur(6px);display:none;padding:9vh 16px}
#search-ov.show{display:block}
#search-box{max-width:720px;margin:0 auto;background:var(--card);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden;border:1px solid var(--line)}
#search-input{width:100%;padding:18px 22px;font-size:17px;background:transparent;color:var(--txt);outline:none;border:none}
#search-res{max-height:58vh;overflow-y:auto;border-top:1px solid var(--line)}

/* ---------- 弹窗 / Toast ---------- */
.modal-mask{position:fixed;inset:0;z-index:85;background:rgba(43,35,30,.55);display:none;align-items:center;justify-content:center;padding:18px}
.modal-mask.show{display:flex}
.modal-box{background:var(--card);border-radius:22px;max-width:860px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#toasts{position:fixed;top:76px;right:16px;z-index:95;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--card);border-left:4px solid #FF6B8A;color:var(--txt);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;font-weight:600;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* ---------- 404 页面 ---------- */
.four04{min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.four04 h1{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-size:clamp(26px,5vw,44px);color:var(--sakura2)}

/* ---------- 页面切换动画（300ms 淡入 + 上移） ---------- */
.view-enter{animation:viewIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view-leave{animation:viewOut .3s ease forwards}
@keyframes viewOut{to{opacity:0;transform:translateY(-10px)}}

/* 通用工具 */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700}
.pill-pink{background:rgba(255,183,197,.25);color:#E34E77}
.pill-mizu{background:rgba(168,216,234,.3);color:#2E7FA3}
.pill-matcha{background:rgba(157,192,139,.3);color:#4E7A3E}
.pill-lemon{background:rgba(255,229,153,.4);color:#8A6D1A}
.pill-brown{background:rgba(139,115,85,.18);color:#7A6548}

/* ---------- 打call荧光棒 ---------- */
.call-stick{display:flex;flex-direction:column;align-items:center}
.stick-beam{width:14px;height:64px;border-radius:7px;transform-origin:bottom center}
.stick-handle{width:18px;height:36px;border-radius:5px;background:#4A3F35;margin-top:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.stick-beam.wave{animation:stickWave .5s ease}
@keyframes stickWave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-30deg)}75%{transform:rotate(30deg)}}

/* 动效尊重系统设置：减少动效时关闭花瓣/音符/跳动 */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
  #petals,#float-notes{display:none}
}
</style>

/* 卡片角落乐器图标 */
function cornerIc(type, color){
  return '<span class="corner-ic" style="color:'+(color||'#FFB7C5')+'">'+(ICONS[type]||ICONS.note)+'</span>';
}
/* 图片占位渲染：有真实图输出 <img>，无则输出风格化占位块 */
function ph(key, cls, label, opts){
  opts = opts||{};
  let url = MEDIA[key]||'';
  const _ak = key.match(/^([A-Za-z0-9_]+)\[(\d+)\]$/);
  if(!url && _ak){ url = (MEDIA[_ak[1]]||[])[+_ak[2]]||''; } // 图库数组索引 key
  if(url) return '<img src="'+url+'" alt="'+label+'" loading="lazy" class="'+cls+'" style="object-fit:cover;width:100%;height:100%">';
  const g = opts.grad || 'linear-gradient(135deg,#FFD9E2,#A8D8EA)';
  const ic = opts.ic ? ICONS[opts.ic] : '<span style="font-size:1.6em">'+opts.emoji+'</span>';
  return '<div class="ph-block '+cls+'" style="background:'+g+';display:flex;align-items:center;justify-content:center;color:rgba(93,78,55,.6);width:100%;height:100%;position:relative">'
    +'<div style="text-align:center;padding:8px"><div style="opacity:.9">'+ic+'</div>'
    +'<div style="font-size:11px;font-weight:700;margin-top:4px;letter-spacing:.06em">'+label+'</div></div></div>';
}

function d(base, weeks){
  const dt = new Date(base.replace(/-/g,'/'));
  dt.setDate(dt.getDate() + weeks*7);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

/* ============================================================

const $  = (s, el)=> (el||document).querySelector(s);
const $$ = (s, el)=> Array.from((el||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 时长格式化 mm:ss */
function fmtD(sec){ sec = Math.round(sec||0); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
/* 歌曲分类徽章 */
function catPill(cat){ const c=CAT_MAP[cat]||{}; return '<span class="pill" style="background:'+c.color+'22;color:'+c.color+'">'+esc(c.name||cat)+'</span>'; }
/* 歌曲单行（表格行） */
function songRow(s){
  return '<tr data-play="'+s.id+'" class="cursor-pointer hover:bg-warmgray/60 dark:hover:bg-[#4A3B31] transition-colors">'
   +'<td class="w-10 text-center"><span class="text-sakura2">'+ICONS.play+'</span></td>'
   +'<td style="width:34%"><a data-route="/song/'+s.id+'" class="font-bold hover:text-sakura2">'+esc(s.t)+'</a>'
   +'<div class="text-[11px] text-[var(--txt-2)]">'+esc(s.ro)+'</div></td>'
   +'<td style="width:18%">'+esc(s.unit)+'</td>'
   +'<td style="width:14%">'+catPill(s.cat)+'</td>'
   +'<td style="width:10%" class="tabular-nums text-[var(--txt-2)]">'+fmtD(s.dur)+'</td>'
   +'<td style="width:14%" class="text-[11px] text-[var(--txt-2)]">'+esc(s.ep||'—')+'</td></tr>';
}
/* 歌曲卡片（网格用） */
function songCard(s){
  return '<div class="kcard p-4 flex items-start gap-3 cursor-pointer" data-play="'+s.id+'" role="button" aria-label="播放 '+esc(s.t)+'">'
   +cornerIc('note', '#FFB7C5')
   +'<div class="w-11 h-11 rounded-xl shrink-0 flex items-center justify-center text-white text-lg" style="background:linear-gradient(135deg,'+(CAT_MAP[s.cat]?CAT_MAP[s.cat].color:'#FFB7C5')+',#8B7355)">▶</div>'
   +'<div class="min-w-0"><div class="font-bold truncate">'+esc(s.t)+'</div>'
   +'<div class="text-[11px] text-[var(--txt-2)] truncate">'+esc(s.unit)+' · '+esc(s.ro)+'</div>'
   +'<div class="text-[11px] text-sakura2 mt-1">'+fmtD(s.dur)+'</div></div></div>';
}
/* 角色小卡片 */
function charCard(c){
  const av = MEDIA[c.id]

  return '<a data-route="/character/'+c.id+'" class="kcard p-4 flex items-center gap-3 cursor-pointer" role="link">'
   +cornerIc(c.icon, c.color)
   +av
   +'<div class="min-w-0"><div class="font-bold">'+esc(c.nameZh)+' <span class="text-[11px] text-[var(--txt-2)]">'+esc(c.nameJp)+'</span></div>'

   +'<span class="text-sakura2 ml-auto">'+ICONS.chevron+'</span></a>';

      '她被律拉进部室时，用的借口是「不想站在人前」。这个理由最后没有成立——后来她不仅要在文化祭上唱歌，还成了乐队对外的门面。作品正是靠这种「说反话」的方式塑造她的：她越是说自己不行，越是在关键时刻撑住了场面。',
      '还有一层设计很有意思：轻音部里喊得最大声的是律，但真正在背后收拾一切的，往往是澪。补课、写歌词、调解、提醒，这些没人会注意的事，基本都是她在做。她嘴上毒舌，身体却很诚实地照顾着每一个人。',
      '她也是五个人里唯一会认真读谱、把音乐当正经事对待的人。这份较真，让她既显得格格不入，又成了整个社团质量的底线。',
      '如果律是往前冲的那个人，澪就是让队伍不至于散架的那个人。这两种气质，构成了轻音部最稳的底盘。']},
    {h:'五、想当「普通高中生」的大小姐：琴吹紬', p:[
      '琴吹紬的加入，是全作最温柔的一个玩笑。她出身大财阀，家里有别墅、有司机、有私人的一切，本来打算去参观合唱部；结果在半路上被律「请」进了音乐室，从此成了键盘手。',
      '这个角色的核心矛盾是：她什么都不缺，唯一的愿望反而是「过普通女高中生的生活」。所以她对部室里的每一件小事都充满新鲜感——一起喝茶、一起挤在狭小的房间里、一起为了一场演出紧张。',
      '紬的温柔不是没有棱角的。平时的她笑眯眯的，说话轻声细语，可一旦涉及朋友，她会有非常明确的立场。作品里多次出现过她「护着大家」的瞬间，语气依然温柔，态度却不容商量。',
      '而最让人印象深刻的是她那种近乎荒诞的实用能力：需要别墅就有别墅，需要砍价就能砍到半价。这些设定看起来很夸张，但落到剧情里，其实是在承担一个功能——为这群普通女孩的日常，兜住物质上的底。',
      '另外，她也是全团最会照顾人情绪的一个。她总能第一时间察觉到别人的不安，然后不声不响地做点什么。这种体贴不做作，也不需要回报，是轻音部里最稳定的那股暖流。']},
    {h:'六、把「軽音楽」听成「軽い音楽」的女孩', p:[
      '平泽唯的登场，是这一切的转折点。她填社团申请表的时候，把「軽音楽（轻音乐）」听成了「軽い音楽（轻松的音乐）」，以为这个社团就是玩玩响板、轻轻松松地打发时间，于是高高兴兴地报了名。',
      '这个误会，是整部作品的起点，也是主角性格的第一次亮相：天然呆、理解力跑偏、完全没有自觉。但作品没有把她写成单纯的「笨蛋」。',
      '当她得知必须真的学会一件乐器之后，第一反应确实是退部——这非常真实。一个从幼儿园到中学都「ぼーっと」（发呆）过来的人，突然被要求掌握一门技能，退缩是合理的。',
      '真正留住她的，不是任何人的劝说，而是一次偶然的旁听：她推开门，看到律、澪、紬三个人认真合奏的样子。那一刻她第一次说出了「我要加入这个社团」。',
      '这个设计很关键：唯不是被「道理」说服的，而是被「人」吸引的。这一点贯穿全作——她所有的坚持，动力都来自关系，而不是来自目标。',
      '而她身上另一样东西更值得说：绝对音感。她不需要调音器就能听准音高，和弦听一遍就能复制。这份天赋几乎没有被用来推动任何「天才叙事」——它只是让这个平时迷迷糊糊的女孩，在音乐面前突然变得可靠。']},
    {h:'七、传奇的砍价：ギー太的诞生', p:[
      '决定留下之后，唯面临一个现实问题：买琴。她在乐器店里对一把 Gibson Les Paul 一见钟情，标价二十五万日元——对高中生来说，这是个天文数字。',
      '接下来的桥段是全作最著名的喜剧场面之一：同行的琴吹紬用一句轻描淡写的「五万日元，可以的吧？」，当场让店员缴械投降。这段被观众戏称为「大小姐的谈判术」。',
      '琴买到手，唯给它取了名字——「ギー太」。这个名字背后是日语的双关：把「ギター（吉他）」和带点男孩子气的后缀「太」拼在一起，既是昵称，也像在给一个家人取名。',
      '从此以后，这把吉他不再只是乐器：她抱着它睡觉、给它穿衣服、跟它说话。作品用这种方式，悄悄把「物」变成了「伙伴」，也预示了后面所有关于「舍不得放下」的情节。',
      '这段戏还有一层潜台词：唯为了这把琴，第一次认真地请求别人帮忙，也第一次为一个具体的愿望付出代价。对一个从小什么都不太在意的人来说，这是成长的起点。']},
    {h:'八、「放課後ティータイム」这个名字', p:[
      '很多人以为这个队名是主角们自己取的，其实是顾问老师山中佐和子起的。理由也非常朴素——她每次推开音乐室的门，看到的都是几个人在喝茶、吃蛋糕。',
      '这个名字带着一点自嘲，甚至有点不像「乐队名」。但正是它，把这部作品的世界观说清楚了：对她们来说，乐队不是通往某个更大舞台的跳板，而是放学后可以安心待着的地方。',
      '名字一旦定下，就成了一种承诺。后来无论她们去到哪里，这个番号都没有变。剧场版里唯说过一句话——「无论我们去到哪里，我们都是放課後ティータイム」——这句话的分量，正来自队名本身那句轻飘飘的玩笑。',
      '从命名这件小事上，还能看出作品的一个倾向：它总是把最重要的决定，交给最日常的瞬间。不是开会讨论、不是郑重起誓，而是老师随口一说，大家觉得不错，就这么定了。']},
    {h:'九、顾问老师山中佐和子：一个反差的成人角色', p:[
      '轻音部能顺利起步，离不开顾问老师山中佐和子。',
      '她表面上是温柔贤淑的音乐教师，实际却是高中时期重金属乐队 DEATH DEVIL 的主唱。这段「黑历史」被她封存在柜子里，却总被学生们挖出来。',
      '这个设定的妙处在于：她是全作唯一的「成年人视角」。她经历过社团、演出、乐队解散，知道青春必然会有结束的一天。但她没有去说教，而是选择用最放任的方式，让这群女孩自己去经历。',
      '她替她们起名、做演出服、教吉他、当教练，做的都是「大人该做但不显眼」的事。作品没有把她塑造成导师型人物，而是让她成了一个体贴的旁观者——这一点相当少见，也相当动人。']},
    {h:'十、部室里的日常：红茶、蛋糕，与必要的无所事事', p:[
      '《轻音少女》最被记住的，往往不是演出，而是那些「什么都没发生」的段落：五个人围坐喝茶，讨论要不要再来一块蛋糕，为了谁去泡茶推诿半天，或者干脆一起发呆。',
      '在传统的叙事里，这些都属于「应该被剪掉的废戏」。但这部作品偏偏把它们放到了中心位置。',
      '原因其实不难理解：真正让人怀念的青春，从来不是某一次高光时刻，而是那些重复了无数遍、当时毫不在意、事后却再也回不去的下午。',
      '所以它需要大量的「无所事事」。这些无所事事不是填充，而是内容本身——它们才是那段时光真正的样子。',
      '而「茶会」这个概念，也被作品有意地做成了仪式的替代品。她们没有隆重的集会，只是每天坐下来喝一杯茶。可正是这种日复一日的重复，让这间教室变成了「属于她们的地方」。']},
    {h:'十一、为什么「开始了」这句话如此重要', p:[
      '「放課後ティータイム、はじまるよ」——这句话表面上是开场白，实际上是一句提前写好的告别。',
      '因为只有「开始」被清楚地标出来，后来的「结束」才显得有重量。整部作品从头到尾都在做同一件事：认真地把这段普通的日子记录下来，好让它结束的时候，观众能感受到那种真实的失落。',
      '这一点也是《轻音少女》最容易被低估的地方。它看起来没有任何野心，不设悬念、不搞反转、不制造强冲突。但它对「时间流逝」的处理极其准确——平时不动声色，一旦回头，才发现已经走了那么远。']},
    {h:'十二、尾声：不起眼的日子，也值得被认真对待', p:[
      '回到最初那间音乐室。四个女孩子，一张长桌，一壶红茶，一把还没人会弹的吉他。没有远大的目标，没有非赢不可的对手。',
      '所谓开始，往往就是这么不起眼。',
      '而《轻音少女》想说的或许正是：不起眼的日子，也值得被认真对待。因为对大多数人来说，人生里真正重要的东西，恰恰不是那些被高光照亮的瞬间，而是那些当时以为会一直持续下去的、平淡的下午。']}
  ]},
{ id:'banner2', key:'banner2', ja:'学園祭ライブ、最高でした！', zh:'学园祭演出，太棒了！',
  date:'2026-10-07', tag:'名场面考据', read:'约 12 分钟', ic:'mic', c:'#E0783C',
  title:'学园祭演出，太棒了！——那一晚舞台上的意外与奇迹',
  lead:'这是轻音部第一次站上真正的舞台。主唱在演出前把嗓子唱哑了，鼓手发着高烧进了医院，贝斯手被临时推上主唱位——从任何角度看，这都是一场灾难。可台下所有人在散场后都在说同一句话：学园祭演出，太棒了。',
  body:[
    {h:'一、文化祭：日本高中最重要的一场「非日常」', p:[
      '要理解这场演出的分量，得先理解文化祭在日本高中生活里的位置。它是一年里极少数被正式允许「越界」的日子：班级停课、校舍向公众开放、学生自己搭舞台、办摊位、办演出。',
      '对一个刚成立、连曲目都没练熟的社团来说，文化祭既是机会，也是压力。它不像日常的部活那样可以随时暂停——日子定了，就要上台。',
      '《轻音少女》选择把「第一次真正演出」设定在文化祭，等于一次性把所有变量都推到最大：观众是全校师生和校外访客，场地是讲堂，时间无法更改。四个人没有任何退路。',
      '还有一点值得注意：文化祭的演出是「非专业」的。没有专业的音响团队，没有彩排多少次的机会，台下坐着的可能是同班同学，也可能是完全不认识的人。',
      '这种半吊子的状态，恰恰是青春题材最真实的舞台。它不完美，但足够郑重。',
      '还有一点容易被忽略：文化祭的演出是「自己争取来的」。轻音部当时并不是被安排上台，而是需要报名、审核、争取时段的。也就是说，能站上那个舞台，本身就是她们主动的结果。',
      '这让整件事的性质发生了变化——不是为了完成谁给的任务，而是「我们自己想做」。这层主动性，是后来所有演出共同的底色。']},
    {h:'二、在台上唱的那首歌：《ふわふわ時間》', p:[
      '她们演出的曲目，是那首后来成为全作代名词的《ふわふわ時間》。',
      '这首曲子有个很有趣的设定：按剧情里的说法，作曲者是琴吹紬，作词者是秋山澪。也就是说，它是由这个社团的成员「自己写出来」的。',
      '歌词写的是再普通不过的日常——「与你一同眺望的风景，虽然早已司空见惯，但对我而言，这个地方就是一切」。它没有宏大的宣言，只是在陈述一种依恋。',
      '而这首歌之所以重要，是因为它后来反复出现在整部作品的关键节点上：第一次登台、夏日的演出、最后的告别。它几乎成了轻音部的「主题曲」。',
      '「ふわふわ」这个词选得也很准。它形容的是一种轻飘飘、不确定、随时会飘走的状态——既是少女心事的质感，也是这段时光本身的质感。',
      '值得一提的是，这首歌的曲风并不复杂，甚至可以说相当朴素：规整的节奏、朗朗上口的旋律、没有炫技的编排。可正是这种朴素，让它能被反复演唱而不显疲态。',
      '在动画的处理上，这首歌的每次出现都配有不同版本的编曲与演唱分配，有时是唯主唱，有时是澪，有时只剩伴奏。同一首歌在不同阶段听起来完全不一样——这也是一种时间感。']},
    {h:'三、主唱把嗓子唱哑了', p:[
      '演出当天最大的意外，出在主唱身上。平泽唯为了这一天拼命练习，结果在正式演出前把嗓子唱哑了，几乎发不出完整的声音。',
      '这个安排看似残酷，其实非常符合角色逻辑。唯是那种一旦投入就会旁若无人的人：她能因为迷上吉他而忘记吃饭睡觉，也就会因为太想唱好而把自己练垮。',
      '作品没有把这件事处理成「努力就会有好结果」的励志桥段，反而让它变成了一个实实在在的危机——学生会因为过度努力而失去上台的资格。',
      '这种诚实，是这部作品一直保持的品质。它不承诺努力必有回报，但它承认努力本身是有分量的。',
      '同时，这个意外也完成了另一件事：它把聚光灯从主角身上移开了。按理说，主唱是舞台上最显眼的位置，而作品选择让唯在最关键的时候「失去」这个位置——这为后面澪的登场铺好了路。']},
    {h:'四、被推上麦克风的贝斯手', p:[
      '于是，临时接过麦克风的人，是平时躲在最里面弹贝斯、怕生到极点的秋山澪。',
      '这个选择的戏剧张力非常大：全团胆子最小的人，被推到了最显眼的位置。而更妙的是，她不是因为自信而站上去的，恰恰相反——她是被逼到没有退路才站上去的。',
      '作品在这里没有给澪安排任何心理建设的过程。她没有被谁「开导」，也没有突然爆发。她就是站在那里，几乎要哭出来。',
      '真正把她拉回来的，是背后传来的一声鼓点。那是律。她什么都没说，只是照常敲下去，而澪就跟上了。这一幕几乎没有台词，却把两个人之间的关系讲得很清楚：她们不需要言语就能互相托住。',
      '顺带一提，这个设定在现实层面也很有意思：为澪配音的声优本人是右撇子，而澪是左撇子贝斯手。为了还原这个细节，声优专门用左手练习演奏。这种较真，也能说明制作组对这部作品的态度。']},
    {h:'五、病床上的那第五个人', p:[
      '比主唱失声更戏剧性的是：鼓手田井中律在演出前后发起了高烧，被送进了医院。台上是四个人，台下少了一个。',
      '律是轻音部的部长，也是整支队伍的节奏核心。她的缺席意味着两件事：一是这场演出在人员上不完整，二是那个永远在场的人，第一次不在了。',
      '作品安排了一个耐人寻味的细节：唯试图顶替她打鼓，结果连鼓棒都握不明白。这个「失败的顶替」，看似是笑料，实际上是一句很重的注脚——有些位置，真的只有那一个人坐得住。',
      '而律在病房里听着这场演出的处理，也让这场「不完整的演出」有了另一个视角：她不在台上，但她依然是这场演出的一部分。',
      '这段剧情还有一个隐藏的作用：它第一次让观众意识到，这五个人并不是永远都会在一起的。一次高烧就能让队伍缺一个人，那么毕业呢？']},
    {h:'六、不完美的演出，为什么反而最动人', p:[
      '把这场演出的所有条件列出来：主唱失声、鼓手缺席、成员是新人、曲目是自己写的、没有专业指导。',
      '按照一般叙事的逻辑，这应该是一场用来「失败后成长」的戏。但《轻音少女》没有这样处理。',
      '它让她们就这样把演出完成了。没有奇迹般地恢复嗓音，没有突然降临的救兵，甚至谈不上多精彩。它就是一场笨拙的、带着各种瑕疵的高中演出。',
      '而观众记住的，恰恰是这个「不完美」。因为它真实——真实的青春期演出，本来就是会走音、会忘词、会紧张的。完美的舞台反而让人疏远。',
      '更深一层看，作品其实在暗示一件事：演出的价值不在于「完成度」，而在于「有没有人真的在那里」。只要人是真的、紧张是真的、开心是真的，舞台就已经成立了。']},
    {h:'七、这句台词：「现在这个讲堂，就是我们的武道馆」', p:[
      '后来，澪说过一句被反复引用的话：「现在这个讲堂，就是我们的武道馆。」',
      '日本武道馆是无数音乐人的梦想舞台。把一间普通的高中讲堂和它相提并论，听起来像是玩笑。但在这句话的语境里，它是认真的。',
      '这句话之所以成立，是因为它重新定义了「顶点」：重要的不是场地有多大，而是此刻站在这里的人，是不是你最想一起站在这里的人。',
      '从这个角度看，文化祭的讲堂确实就是她们的武道馆——甚至可以说，后来她们站上的任何更大的舞台，都无法完全替代这一晚的意义。',
      '这句台词后来也成了整部作品的一个注脚：它把「成功」这个词，从外部的评价标准里拿了出来，交给了当事人自己定义。']},
    {h:'八、这场演出对后续剧情的影响', p:[
      '第一次演出以后，轻音部的一切都变了。',
      '她们有了自己的代表曲目，有了「上过台」的经验，也有了被新生注意到的理由——中野梓后来之所以会推开音乐室的门，很大程度上就是因为看过她们的演出。',
      '更重要的是，这次经历确立了轻音部处理危机的方式：不追求完美，而是想尽办法让「大家在一起」这件事完成下去。嗓子哑了就换人唱，鼓手不在就先撑过去。',
      '这种「无论如何都要一起做完」的态度，成了这支队伍之后所有选择的底层逻辑。无论是后来的夏日演出、文化祭，还是最后的毕业演奏，处理方式都一脉相承。',
      '所以这场演出不只是一次「事件」，它是这个社团性格的成型时刻。']},
    {h:'九、为什么「最高でした」不是一句客套', p:[
      '「最高でした」是日语里最常用的一句赞美，日常到近乎客套。但在这个语境里，它有了具体的重量。',
      '因为它赞美的不是技术水准，而是「她们真的做到了」。一场本该搞砸的演出，被四个毫无经验的高中生硬生生完成了。',
      '这就是青春题材最动人的地方：观众并不在意结果是否完美，在意的是她们有没有认真对待那段时光。',
      '换句话说，这句「最高でした」赞美的对象，其实不是演出，而是那几个人。',
      '还可以从另一个角度看：在日语语境里，「最高」是一个很口语、很直接的说法，常常出现在演唱会散场后观众的评价里。作品让这句最普通的感想出现在最关键的场合，本身就是一种轻描淡写的郑重。']},
    {h:'十、从「第一次上台」到「最后一次上台」', p:[
      '如果把这第一次演出放到整部作品的时间线上看，它的意义会更清楚。',
      '这一次，她们是紧张到发抖的新人；下一次，她们会越来越熟练；而到了最后一次，她们已经知道这是最后一次，于是每一句歌词都带着告别的意味。',
      '作品没有刻意对比这几场演出，但这种自然的演进，本身就是最动人的叙事。人在同样的地方、做着同样的事，可每一次的心情都不一样。',
      '这也是成长最真实的样子：不是某一次突然的蜕变，而是在重复中不知不觉地改变了。']},
    {h:'十一、尾声：一场演出，一段青春', p:[
      '许多年后，人们可能会忘记那场演出具体唱了什么、走没走音。但他们会记得那种感觉——几个不太靠谱的人，为了同一件事紧张、出错、然后继续。',
      '学园祭只有一天，但它留下的东西会持续很久。',
      '对轻音部来说，那一晚的讲堂，确实是她们站过的、最亮的地方。而所谓「最高」，说的从来不是那场演出，而是那段再也回不去的时间。']}
  ]},
{ id:'banner3', key:'banner3', ja:'修学旅行、いってきまーす！', zh:'修学旅行，出发啦！',
  date:'2026-10-07', tag:'剧情随笔', read:'约 11 分钟', ic:'star', c:'#2E7FA3',
  title:'修学旅行，出发啦！——京都的几天，与留在家里的那间部室',
  lead:'「修学旅行、いってきまーす！」——背上行李，坐上开往京都的列车。这是她们第一次以「一个班」的身份一起出远门，也是《轻音少女》悄悄换了一层底色的开始。',
  body:[
    {h:'一、修学旅行：日本高中三年里的一件大事', p:[
      '在日本的高中生活里，修学旅行几乎是和毕业典礼并列的记忆锚点。通常是高二或高三，全班集体出行三四天，去京都、奈良这类有历史文化背景的城市。',
      '它的特别之处在于：这是学生们第一次长时间离开学校，也是第一次以「同班同学」而不是「社团成员」的身份相处。',
      '对轻音部来说，这意味着一个微妙的转变：她们不再是放学后聚在音乐室的那五个人，而是被拆散到各个班级、和更多人相处的普通高中生。',
      '同时，修学旅行也意味着「集体」这个概念被放大了。社团只有五个人，班集体却有几十个人。作品把她们放进这样的环境里，等于让这段关系接受了一次轻微的稀释——然后在稀释之后，让观众看到它依然牢固。',
      '从叙事节奏上看，修学旅行段落也是整部作品里少见的「外部世界介入」的部分。前面大部分剧情都发生在学校与部室这两个封闭空间里，而这一次，她们被放到了公共空间——旅馆、街道、景点。',
      '空间一放开，人物的关系反而更清楚了。因为在学校里，她们是「轻音部成员」；而在旅途中，她们只是几个普通的女孩子，需要自己决定去哪、吃什么、几点起床。角色因此变得更具体。']},
    {h:'二、为什么是京都', p:[
      '关西的京都，是日本修学旅行最经典的目的地：寺庙、神社、石板路、和服。',
      '选择这样的场景，对作品来说是一把双刃剑。京都的画面感很强，容易让作品显得「在观光」；处理不好，就会变成流水账。',
      '《轻音少女》的应对方式是：把注意力从「景点」上移开，始终放在人身上。她们当然看了寺庙，但作品真正停留的，是旅馆房间里挤在一起聊天、是穿着和服手忙脚乱、是在陌生城市里迷路。',
      '换句话说，京都只是背景，人才是内容。',
      '这也解释了为什么这一段剧情很难被「概括」。它没有明确的情节推进，所有的价值都在细节里——而这些细节，恰恰是刷第二遍时才会注意到的东西。']},
    {h:'三、出发前的那点小心思', p:[
      '修学旅行前的准备过程，是这类题材最好用的段落。买行李箱、查攻略、讨论要不要带某件衣服——这些细碎的动作，天然带着期待感。',
      '对轻音部来说，还有一层额外的情绪：这是她们上大学之前，为数不多的几次「一起出远门」的机会。',
      '作品没有直接把这层情绪说出来，而是靠细节铺垫：比如反复出现的「下次」——下次一起去哪里、下次要做什么。这些「下次」在当时听上去很自然，事后回头看却会有些沉重。',
      '这种「不说破」的处理，是《轻音少女》贯穿始终的手法。它相信观众会自己感受到，而不是把情绪提前贴在画面上。']},
    {h:'四、和服、围观，与想钻地缝的澪', p:[
      '京桥段里最出彩的一场戏，落在秋山澪身上。',
      '在旅馆里，几个人换上了和服。平时就害怕被人注目的澪，一出门就被同学团团围住夸赞。她那种手足无措、恨不得钻进地缝的反应，几乎是这个角色所有性格特征的集中演出。',
      '这段戏的处理很关键：作品没有让澪「克服」害羞、变得大方，也没有让她的害羞成为别人取笑的对象。它就让它那样发生着——同学善意地夸她，她狼狈地躲开，然后大家一起笑。',
      '这种不施压的温柔，是《轻音少女》最难得的地方。它从不要求角色变成另一个人。',
      '在很多成长故事里，害羞、胆小这类性格特征都会被当作「缺点」，需要一个契机去克服。而这部作品的态度是：它们就是这些人的一部分，不需要被纠正。',
      '这段戏还有一层当下的意味：它展示的是一个「被善意包围」的场景。同学们的笑没有恶意，澪的窘迫也不会被利用。这种温和的氛围，是整部作品能让人放松下来的重要原因。']},
    {h:'五、唯的迷路，与习以为常的照顾', p:[
      '与澪相对的另一条线，是平泽唯的走失。',
      '在陌生城市里，迷糊的唯理所当然地迷了路，又被理所当然地找了回来。这件事在她们之间，已经没有任何紧张感了。',
      '这个设计透露了一个很重要的信息：这几个人的关系，已经过了「磨合期」。她们不再需要为彼此的毛病惊讶或生气，而是默认了「她就是这样的人」并提前做好准备。',
      '在日常系作品里，这种「习以为常」比任何表白都更像是关系确立的证据。',
      '它也说明了一件事：真正的亲密，不是把对方变成更好的人，而是接受对方原本的样子，并围绕着它安排生活。',
      '这种接受是双向的。唯也在用她自己的方式照顾别人——虽然经常帮倒忙，但她的注意力始终在别人身上。她会第一个注意到有人不开心，会毫不掩饰地表达喜欢。',
      '一个迷糊到会走丢的人，却很少在情感上「走丢」。这是唯这个角色最容易被低估的地方。']},
    {h:'六、天台上那场什么都没发生的夜谈', p:[
      '到了晚上，几个人坐在住宿处的天台上聊天。',
      '没有演出、没有练习、没有突发事件，只有夜风、远处的灯火，和一些不着边际的话题。',
      '许多观众记住的正是这类「什么都没发生」的场景。它们很难被概括成一句剧情简介，却是整部作品真正的血肉。',
      '原因也许在于：人在旅途中的夜晚，是最容易袒露真实心情的时刻。白天有行程要赶、有照片要拍，只有到了夜深，几个人并排坐着的时候，才会突然意识到——这样的日子，真的剩不多了。',
      '作品没有让她们在这段夜谈里说出任何重要的台词。恰恰是这种留白，让这段戏有了余味。']},
    {h:'七、留在家里的那三个人，与那间空部室', p:[
      '前辈们外出期间，部室并没有空着。它交给了刚入部不久的中野梓，以及忧和纯。',
      '三个人在空荡荡的音乐室里泡茶、闲聊，把社团的日常维持着。她们嘴上抱怨前辈不靠谱，心里却盼着她们早点回来。',
      '这条平行叙事线，是整段修学旅行里最有分量的一笔。它让「离开」有了另一侧的视角：不只是出发的人会想念，留下的人也在等待。',
      '而后辈们那份「想被需要」的心情，正是后来毕业篇里所有眼泪的伏笔。',
      '从结构上看，这条线也解决了修学旅行段落「容易变成独角戏」的问题。有了留守的视角，整段剧情的情绪才有了两个支点。']},
    {h:'八、梓的那句话，几乎是整部作品的题眼', p:[
      '中野梓在留守的那几天里说过一句话：「果然……和前辈们在一起很开心。」',
      '这句话乍看平淡，但放在整部作品的脉络里，几乎是题眼。',
      '梓是从「正常人」视角进入轻音部的人。她认真、要强、对音乐有洁癖，最初完全无法接受前辈们每天喝茶吃蛋糕。可正是她，最后说出了这句话。',
      '这等于作品借她的口承认了一件事：那些看起来不务正业的日常，才是真正让人留恋的东西。',
      '而更值得注意的是她说这句话时的坦白。她是后辈，习惯了隐藏自己的情绪、表现得成熟可靠。能说出「很开心」，对她来说本身就是一种松动。']},
    {h:'九、忧与纯：另一条被忽视的支线', p:[
      '在这段留守的日子里，还有两个容易被忽略的角色：唯的妹妹平泽忧，以及她们的同班同学铃木纯。',
      '忧是那种「全能妹妹」——家务、学习、照顾姐姐样样在行。她和梓、纯的关系，代表了另一种友情形态：不以社团为纽带，只是同班同学之间的日常陪伴。',
      '这条支线的价值在于，它把「轻音部」这个小圈子放回了更大的现实里。除了那间音乐室，她们也有普通的高中生活：一起上课、一起抱怨、一起在放学后无所事事。',
      '两条线交织起来，才构成了完整的青春图景。',
      '顺便一提，忧与纯这条线还承担了一个现实的对照功能：并不是所有人都必须加入社团、必须投入某项活动。有些人就是安安静静地过普通的高中生活，然后在朋友的社团里帮点忙。',
      '作品没有把这种「普通」写成遗憾，而是让它同样成立。这种宽容的视角，是《轻音少女》能让人反复回看的原因之一。']},
    {h:'十、一次很轻的告别预演', p:[
      '修学旅行表面上很轻松，实际上却是全作第一次让「她们总有一天会分开」这件事浮出水面。',
      '高二的她们，还能一起在旅馆聊天、一起在陌生的街道上迷路。可距离毕业只剩一年多，而一旦毕业，五个人就会走上不同的路。',
      '所以这趟旅行的意义，与其说是「去玩」，不如说是「在还能一起出发的时候，一起出发一次」。',
      '这也是为什么那句「いってきまーす」读起来会有一点复杂——它不只是出发的意思，更像是在练习，将来该怎么好好地说再见。',
      '日语里「いってきます」是一个每次出门都要说的话，回应是「いってらっしゃい」。它预设了「你还会回来」。而随着剧情推进，观众会慢慢意识到，有些出发是没有对应的「我回来了」的。']},
    {h:'十一、出发这件事本身的意义', p:[
      '在《轻音少女》里，目的地的风景从来不是重点。',
      '她们去了京都，看了寺庙，拍了照片，然后回来了。许多年后，她们大概不会记得某一座寺庙的具体样子。',
      '但她们会记得，在某个傍晚，几个人坐在旅馆的天台上吹风；会记得澪被夸得抬不起头的样子；会记得唯又走丢了。',
      '这就是「出发」真正的意义：重要的不是去哪里，而是和谁一起去。',
      '所以「修学旅行、いってきまーす」这句喊出来的话，其实包含了整部作品最核心的那份珍重——趁还来得及，一起去一次吧。']}
  ]},
{ id:'banner4', key:'banner4', ja:'ロンドンへ、Go! Go!', zh:'出发去伦敦，Go! Go!',
  date:'2026-10-07', tag:'剧场版特辑', read:'约 12 分钟', ic:'sakura', c:'#8B7355',
  title:'出发去伦敦，Go! Go!——毕业旅行，与一间教室里的告别曲',
  lead:'「ロンドンへ、Go! Go!」——2011 年的剧场版，把五个人送到了伦敦。表面上是一趟毕业旅行，实际上是她们作为「高中生的五个人」，最后一次一起出远门。',
  body:[
    {h:'一、剧场版的定位：一次正式的告别', p:[
      '《轻音少女》剧场版于 2011 年上映，故事紧接电视动画第二季的结局。',
      '它要处理的问题很明确：五个人里，四个人即将毕业升入同一所大学，而中野梓还要在樱丘高中再读一年。这个设定从一开始就埋下了矛盾——「五个人」这个单位，就要维持不下去了。',
      '所以剧场版的任务，既不是讲一个新的大冒险，也不是给系列画上句号，而是认真地把这段关系里最难的那部分拍出来：如何好好告别。',
      '值得注意的是，作品选择用「一次旅行」来承载这个主题，而不是用一场毕业典礼。这是个很聪明的决定——旅行的时间是有限的、集中的，天然适合「把最后的日子过好」这种叙事。']},
    {h:'二、为什么选择了伦敦', p:[
      '把毕业旅行的目的地设定在伦敦，是个很聪明的选择。',
      '首先，它足够远。远到能让这次的「一起出远门」具有仪式感——不是去京都看寺庙，而是真的离开熟悉的一切，去一个语言不通的国家。',
      '其次，它足够陌生。陌生的环境会把人的依赖关系放大：谁负责看地图、谁负责点餐、谁最容易走丢，在异国他乡都会被清楚地暴露出来。',
      '最重要的是，它在物理上制造了「只有她们五个人」的处境。没有其他同学、没有老师盯着的行程，她们第一次处在一种完全自主、也完全依赖彼此的状态里。',
      '另外，伦敦这个选择也带着一点浪漫的意味：它是英式摇滚的发源地之一。让一支高中乐队去那里毕业旅行，本身就带着某种呼应。',
      '这个设定还有个很实际的作用：它让「语言不通」成为剧情的一部分。点餐、问路、买东西都可能出状况，而这些小麻烦恰恰会让人更依赖同伴。',
      '在熟悉的环境里，一个人可以独立完成所有事；但在完全陌生的地方，人必须开口求助。作品用这种方式，让五个人第一次真正体验到「互相依靠」的感觉。']},
    {h:'三、伦敦日常：坐错的车、伴手礼，与迷路', p:[
      '有意思的是，剧场版并没有把伦敦拍成一部观光片。',
      '它花了很多篇幅在极其琐碎的事情上：点餐点错、坐错车、在商店里挑伴手礼、为了小事争论不休。',
      '这些段落看起来像凑时长，其实是在完成一个任务：让「日常」延续到最后。哪怕地点换成了伦敦，她们依然是那五个会为了一块蛋糕吵起来的高中生。',
      '这种处理方式，是《轻音少女》一贯的答案——环境可以变，但关系的质感不变。',
      '而正因为这些琐碎被完整保留，最后一幕的重量才成立。观众已经习惯了她们这样过日子，所以当这种日子走到尽头时，失落感是自然产生的，不需要任何额外的渲染。',
      '这种处理方式其实冒着风险：如果观众觉得无聊，整段就会垮掉。但《轻音少女》赌的是观众的耐心与共情——它相信只要日常足够真实，观众就会主动去在意这些人的命运。',
      '从这个角度看，这部作品对观众是相当信任的。它不给强烈的刺激，也不设悬念钩子，只是把日子摊开给你看。']},
    {h:'四、异国旧校舍里的那间教室', p:[
      '剧场版最著名的一幕，发生在一间意外的教室里。',
      '她们在伦敦偶然走进一间旧校舍的教室：木质地板、旧桌椅、一架不知还能不能弹出的旧键盘。房间里没有人，安静得像被时间落下了。',
      '就在这个没有任何观众的地方，四个人开始了演奏。',
      '这个场景的动人之处，恰恰在于它的「不必要」。她们本可以不在那里演奏——没有演出任务、没有观众期待、甚至乐器都未必完好。但她们还是弹了。',
      '因为对她们来说，演奏从来不是为了被听见，而是几个人在一起时最自然的状态。',
      '还有一层呼应值得一提：故事开始的那间音乐室，也在一栋旧校舍里。从樱丘的旧校舍，到伦敦的旧校舍，这个意象走了一个完整的圆。']},
    {h:'五、唱给没能一起来的那个人：《天使にふれたよ!》', p:[
      '她们演奏的曲目，是写给中野梓的《天使にふれたよ!》（触及了天使）。',
      '按设定，这首歌是四个人为了送给梓而创作的，原本计划在毕业式上演唱。它是一次正式的告别，也是一份礼物。',
      '歌词指向的是「相遇」这件事本身——在漫长的、理所当然的日常里，遇见一个让一切变得不一样的人。',
      '把它放在伦敦的教室里弹出来，比放在毕业式的舞台上更合适：因为这不是一场表演，而是一次私人的、只给一个特定的人的表达。',
      '歌名的意思也很微妙。「天使にふれた」直译是「触碰到了天使」。这里的「天使」，指的就是那个让平凡日常变得值得的人——对四个前辈来说，那个人是梓。']},
    {h:'六、梓的处境：那个被留下的人', p:[
      '要理解这首歌的分量，必须先理解中野梓的位置。',
      '她是五个人里唯一的后辈。入部时，她抱着「认真搞乐队」的觉悟，结果发现前辈们整天喝茶吃蛋糕，三观尽碎。她努力过、吐槽过、别扭过，最后还是融进了这个奇怪的集体。',
      '但毕业这件事，把她的处境翻转了：留下来的人是她，被留下的人也是她。',
      '她既担心自己能不能接下轻音部，也害怕自己成为被忘记的那一个。这种「被留下」的恐惧，是青春题材里非常少见、也非常真实的一种情绪。',
      '而这四个人用一首歌回答了她：就算不在同一个学校，这段关系也不会结束。',
      '从叙事结构上看，梓的位置其实是最难写的。她既不是主角，也不是配角；她既是旁观者，也是当事人。作品把她放在这个中间地带，正是为了让「告别」这件事有一个具体的承受者。']},
    {h:'七、毕业式：一场没有煽情的告别', p:[
      '整部作品处理毕业的方式，和它的整体风格保持一致——不煽情，不总结，不发表长篇演说。',
      '毕业式就是毕业式：唱校歌、领证书、拍照、在教室里最后坐一次。该来的日常照常发生，只是这一天之后，有些日常不会再有。',
      '而正因为它不刻意渲染，那份失落才更真实。观众不需要被提醒「这是最后一天」，他们自己会意识到。',
      '这是《轻音少女》最高明的地方：它始终相信观众的感受力，从不把情绪直接塞过来。',
      '甚至连角色自己，也表现得相当克制。她们没有抱头痛哭，没有长篇告别。只是像往常一样说着话、开着玩笑，然后在某个瞬间，突然安静下来。',
      '这个「突然安静下来」的瞬间，往往比任何哭戏都更有效。因为它是失控的——连角色自己都没准备好。作品把最重的情绪藏在这种不经意的缝隙里，而不是放在聚光灯下。']},
    {h:'八、唯的那句话：我们到哪里都是「放課後ティータイム」', p:[
      '在整个毕业叙事里，最像宣言的一句话，出自平泽唯：「无论我们去到哪里，我们都是放課後ティータイム。」',
      '这句话听起来简单，却是对整部作品的一次总结。',
      '因为「放課後ティータイム」从来就不只是一个乐队名。它是那间音乐室、那壶红茶、那些重复了无数遍的下午。只要人还在，这个名字就还能成立。',
      '换句话说，唯给出的答案不是「我们不会分开」，而是「就算分开了，我们也还是我们」。这比任何「永远在一起」的承诺都更可信。',
      '而由唯来说这句话，也很有意思。她是五个人里最不擅长讲道理的那个，平时连作业都要妹妹代写。可正是这样一个人，说出了整部作品里最清醒的一句话。']},
    {h:'九、剧场版之后：故事并没有真正结束', p:[
      '值得一提的是，《轻音少女》的世界在剧场版之后仍在延续。',
      '后续的漫画篇章里，梓和忧、纯一起支撑起了新的轻音部，而升入大学的四个人也开始了新的生活。还出现了新的后辈角色，把这个社团的故事继续往下写。',
      '这说明作品对「毕业」的理解并不悲观：它不是终点，而是关系形态的一次转换。',
      '人会换地方、换身份、换日程，但那些一起度过的时间留下的东西，会以另一种形式继续存在。',
      '从这个角度看，剧场版处理的其实是一个普遍的问题：当共同的生活场景消失之后，一段关系要靠什么继续？作品给的答案很朴素——靠大家还记得。']},
    {h:'十、为什么「毕业旅行」是最好的收尾', p:[
      '回到「旅行」这个形式本身。如果有哪种方式适合承载告别，那大概就是旅行。',
      '因为旅行天然有开始和结束：出发、抵达、游玩、返程。它把一段有限的时间压缩得清清楚楚，让「最后」这件事变得可感知。',
      '在日常生活里，人是很难意识到「这是最后一次」的。但在旅行中不会——行程表上的最后一天，就是最后一天。',
      '作品正是用这种方式，让五个人（和观众）都清楚地知道：这趟旅行结束之后，某种生活就结束了。']},
    {h:'十一、尾声：为什么我们要一路看到伦敦', p:[
      '从旧校舍三楼的那间音乐室，到伦敦旧校舍的那间教室，这部作品走过了很长的一段路。',
      '但仔细看会发现，它其实一直在讲同一件事：几个普通的女孩子，在普通的日常里，认真地对待彼此。',
      '伦敦只是把这件事放到了一个更远的背景里，让那种「无论如何都要一起」的心情显得更清楚。',
      '所以「ロンドンへ、Go! Go!」不只是一句出发的号角。它更像是一个约定——就算走到天涯海角，我们依然是放課後ティータイム。']}
  ]}
,
{ id:'article_graduation', key:'article_grad', ja:'天使にふれたよ!', zh:'相遇天使',
  date:'2026-10-08', tag:'毕业叙事', read:'约 15 分钟', ic:'sakura', c:'#FF6B8A',
  title:'「天使にふれたよ!」——毕业那天，她们在音乐室里留下了什么',
  lead:'第二季最终话，文化祭的舞台上，四个人唱了一首歌给一个人听。那个人站在台下，抱着吉他，哭得不成样子。这首歌叫「天使にふれたよ!」——相遇天使。它是《轻音少女》全作最著名的「催泪弹」，也是整部作品对「毕业」这件事最温柔的回答。',
  body:[
    {h:'一、第二季最终话：那间突然安静下来的音乐室', p:[
      '《轻音少女》第二季的最终话，有一个很特别的开场。',
      '没有热闹的音乐，没有夸张的表情，镜头只是静静地推近那间我们看了两季的音乐室。阳光从窗户斜斜地照进来，落在长桌上，桌上还放着没喝完的红茶和吃了一半的蛋糕。一切看起来和平时没有任何区别。',
      '但观众知道，这一天不一样。这是高三的唯、澪、律、紬在樱丘女子高中的最后一天。过了今天，她们就要毕业了。',
      '作品用这种「一切如常」的方式开场，本身就是一种叙事策略。它不急于渲染离别的情绪，而是先让观众回到那个最熟悉的场景里，然后再一点一点地告诉你：这样的日子，以后不会再有了。',
      '这种处理方式，比任何「毕业快乐」的横幅都更有力量。因为真正让人难过的，从来不是告别的那一刻，而是意识到「日常已经结束了」的那个瞬间。']},
    {h:'二、「天使にふれたよ!」这首歌是怎么来的', p:[
      '在最终话的文化祭演出上，轻音部表演了三首歌。前两首是欢快的《ぴゅあぴゅあはーと》和《U&I》，第三首，也就是安可曲，是一首新歌。',
      '这首歌的名字叫「天使にふれたよ!」，中文通常译作「相遇天使」。作曲是琴吹紬，作词是秋山澪——和轻音部大多数原创曲一样，是成员自己写的。',
      '但这首歌和以往的任何一首都不一样。以往的歌，写的是日常、是暗恋、是想吃的东西、是想睡的午觉。而这首歌，写的是「告别」。',
      '更特别的是，这首歌不是唱给观众的，而是唱给一个特定的人听的——中野梓，轻音部唯一的后辈，也是唯一一个不会毕业的成员。',
      '在演出的最后，唯拿起话筒，对台下的梓说了一句话：「这是我们写给你的歌。」然后音乐响起，四个人在台上唱，梓一个人在台下哭。',
      '这个场景的设计极其精准。它把「毕业」这件事，从一个抽象的概念，变成了一个非常具体的动作——四个人用一首歌，向一个人告别。']},
    {h:'三、唯的歌词：写给梓的「情书」', p:[
      '「天使にふれたよ!」的歌词，是全作最值得逐句分析的文本之一。',
      '歌的开头是这样的：「ねぇ 思い出の欠片に 名前をつけて保存するなら 「宝物」がぴったりだね」——如果要给回忆的碎片取个名字保存起来，「宝物」这个词再合适不过了。',
      '这不是那种宏大的「青春万岁」式的歌词。它非常具体，非常私人。它说的不是「我们的青春很美好」，而是「这些碎片，对我来说是宝物」。',
      '接下来的一段更直接：「過ごした日々 忘れないよ 眠りにつく前に 枕元で 微笑む」——一起度过的日子，不会忘记哦，在入睡前，在枕边微笑。',
      '这句歌词写的是一个非常日常的动作：睡前想起某件事，然后不自觉地笑了。它没有说「我会永远记得你们」，而是用一个具体的画面，表达了同样的意思——而且更动人。',
      '而全歌最核心的一句，是副歌里的「あぁ 天使にふれたよ あぁ 幸せすぎるんだ」——啊，我遇到天使了，啊，我太幸福了。',
      '这句话是唱给梓的。在唯她们眼里，梓不是后辈，不是学妹，而是「天使」。这个称呼听起来很夸张，但放在轻音部的语境里，却无比真诚——因为梓的存在，让她们的高中生活变得完整。']},
    {h:'四、四个人在台上，一个人在台下', p:[
      '「天使にふれたよ!」的演出场景，有一个非常值得注意的构图：四个人在台上，一个人在台下。',
      '这不是偶然的。轻音部平时是五个人一起演出的——唯、澪、律、紬在台上，梓也在台上，她是第二吉他手。但这一次，梓没有上台。',
      '作品用这种方式，把「毕业」的本质可视化了：毕业不是五个人一起离开，而是四个人离开，留下一个人。',
      '梓是那个被留下的人。她要继续在这所学校里待一年，继续使用那间音乐室，继续看到那些熟悉的景物——但身边的人，已经不在了。',
      '这种「被留下」的视角，是大多数毕业题材作品不会选择的。它们通常会站在毕业生的角度，写毕业生的不舍和对未来的期待。但《轻音少女》偏偏把镜头给了那个被留下的人。',
      '因为作品知道，毕业最痛的不是离开的人，而是留下的人。离开的人有新的生活在等着他们，而留下的人，要独自面对那些充满回忆的空房间。',
      '梓在台下哭的那个画面，因此成了全作最著名的催泪场景之一。她抱着吉他，站在人群里，眼泪止不住地流。她不是在为自己哭，她是在为「以后再也不能和她们一起在这里演奏了」而哭。']},
    {h:'五、「わすれない」——不会忘记的是什么', p:[
      '「天使にふれたよ!」里反复出现一个词：「わすれない」——不会忘记。',
      '但这首歌从来没有说清楚，到底不会忘记什么。是不会忘记那间音乐室？不会忘记那壶红茶？不会忘记文化祭的舞台？还是不会忘记那四个人？',
      '答案是：全部。但又不只是全部。',
      '因为「不会忘记」的，不是某一件具体的事，而是一种感觉——那种「和她们在一起的时候，时间过得特别快」的感觉，那种「就算什么都不做也很开心」的感觉，那种「觉得自己被接纳了」的感觉。',
      '这种感觉是无法被具体描述的，所以歌词只能用「宝物」这样的词来概括。它不是某一样东西，而是一整段时光在心里留下的温度。',
      '这也是为什么这首歌能让那么多观众哭。因为每个人心里都有这样一段「宝物」一样的时光——可能是高中，可能是大学，可能是某一段工作经历，可能是某一群人。当这首歌响起的时候，观众想到的不是轻音部，而是自己心里的那段时光。']},
    {h:'六、毕业不是结束：剧场版伦敦的延续', p:[
      '值得注意的是，「天使にふれたよ!」并不是《轻音少女》的终点。',
      '在第二季最终话之后，还有一部剧场版。这部剧场版讲的，是四个人毕业之后、升入大学之前的那段时间里，五个人一起去伦敦旅行的故事。',
      '这个安排很有意思。它没有让故事在毕业的那一刻结束，而是给了观众一个「缓冲期」——在正式说再见之前，再一起去一次旅行。',
      '剧场版的伦敦之行，本质上是一次「延长的告别」。五个人都知道，旅行结束之后，四个人就要去上大学了，梓就要回到学校一个人了。但在旅行中，她们可以暂时忘记这件事，像平时一样吵吵闹闹、吃吃喝喝、走走停停。',
      '剧场版的最后，五个人在伦敦的一间旧校舍里，又一次演奏了「天使にふれたよ!」。这一次，梓也上台了——五个人一起，在伦敦的舞台上，唱了这首歌。',
      '这个场景是对第二季最终话的一次回应。那一次，四个人在台上，一个人在台下。这一次，五个人都在台上。作品用这种方式，给了观众一个更温暖的结尾：就算毕业了，她们还是能一起演奏。']},
    {h:'七、为什么这首歌让那么多人哭', p:[
      '「天使にふれたよ!」是《轻音少女》全作最著名的催泪曲，几乎每一个看过这部作品的人，都会在这首歌响起的时候哭。',
      '但它为什么这么有效？这不是一个简单的问题。',
      '首先，它的「前置铺垫」足够长。观众用了两季的时间，看着这五个女孩子从陌生到熟悉，从凑数到默契，从「轻音部是什么」到「放課後ティータイム」。当这首歌响起的时候，观众不是在听一首新歌，而是在听一段自己也参与了的回忆。',
      '其次，它的「克制」足够到位。这首歌没有用任何煽情的手段——没有弦乐齐鸣，没有哭腔，没有戏剧性的转调。它就是一首轻快的、甚至有点活泼的歌，用最平静的语气，说着最重的话。',
      '这种「用快乐说悲伤」的方式，是最有效的催泪手段。因为它不强迫你哭，它只是让你突然意识到：哦，原来这么开心的歌，唱的是告别啊。然后眼泪就自己下来了。',
      '最后，它的「普遍性」足够强。这首歌写的虽然是轻音部的毕业，但它说的是每一个人都经历过的事——和一群人度过了一段美好的时光，然后不得不分开。这种体验是普遍的，所以这首歌的感染力也是普遍的。']},
    {h:'八、轻音部的「传承」：从唯到梓', p:[
      '「天使にふれたよ!」这首歌，除了是告别，也是一次「传承」。',
      '在歌的最后，唯对梓说了一句话：「轻音部就拜托你了。」这句话很短，但分量很重。它意味着，唯她们把轻音部——那间音乐室、那个乐队名、那些传统——正式交给了梓。',
      '梓接下了这个托付。在第二季的最后，她站在音乐室里，看着空荡荡的房间，然后拿起了唯的吉他「ギー太」，轻轻拨了一下弦。',
      '这个动作是全作最有象征意义的画面之一。它意味着，轻音部没有因为四个人的毕业而消失。它会继续存在，以梓为中心，以新的成员为主体，继续在那间音乐室里喝茶、练琴、发呆。',
      '而在后续的漫画里，梓确实和忧、纯一起，重新组建了轻音部。她们有了新的成员，写了新的歌，甚至也有了自己的文化祭演出。',
      '这种「传承」的设定，让《轻音少女》的毕业叙事不那么悲伤。因为它告诉观众：结束的不是轻音部，只是唯她们那一代人的轻音部。轻音部本身，会一直存在下去。']},
    {h:'九、那间音乐室后来怎么样了', p:[
      '很多观众在看完《轻音少女》之后，都会问一个问题：那间音乐室，后来怎么样了？',
      '作品没有直接回答这个问题。但从各种细节可以推测：那间音乐室还在那里，阳光还是会在下午斜斜地照进来，长桌上还是会放着红茶和蛋糕，只是坐在桌子旁边的人，换了一批又一批。',
      '这其实就是「日常」的本质。日常不是某一群人的日常，而是一个空间里不断发生的、重复的、温暖的小事。人会换，但日常不会停。',
      '从这个角度看，「天使にふれたよ!」这首歌，不只是唱给梓的，也是唱给那间音乐室的。它感谢那间音乐室，容纳了她们两年的青春，见证了她们所有的开心和难过，然后在她们离开之后，继续容纳下一批人的青春。',
      '那间音乐室不会记得她们。但她们会记得那间音乐室。这就够了。']},
    {h:'十、尾声：每个走过青春的人，心里都有一间音乐室', p:[
      '回到「天使にふれたよ!」这首歌本身。',
      '它之所以能成为全作最著名的催泪曲，不是因为它写了多么特别的故事，而是因为它写了一件每个人都经历过的事：和一群人度过了一段美好的时光，然后不得不分开。',
      '每个走过青春的人，心里都有一间「音乐室」。它可能是一间教室，可能是一个社团，可能是一间办公室，可能是某一个经常去的地方。它可能不叫音乐室，可能没有红茶和蛋糕，但它承载的东西是一样的——一段和某些人一起度过的、再也回不去的时光。',
      '「天使にふれたよ!」唱的，就是对那段时光的感谢。它说：我遇到了天使，我太幸福了，我不会忘记。',
      '而每个听到这首歌的人，想到的不是轻音部，而是自己心里的那间「音乐室」，和那些曾经在那间「音乐室」里一起喝茶的人。',
      '这就是这首歌的力量。它不只是一首歌，它是一把钥匙，打开了每个人心里那段被叫做「宝物」的回忆。']}
  ]},
{ id:'article_ui', key:'article_sisters', ja:'U&I', zh:'你和我',
  date:'2026-10-08', tag:'歌曲深度解析', read:'约 15 分钟', ic:'heart', c:'#9DC08B',
  title:'「U&I」——唯写给妹妹的那首歌，与轻音部的「家人」叙事',
  lead:'第二季文化祭，轻音部表演了一首叫《U&I》的歌。这首歌是唯在感冒住院的时候写的，写的是她和妹妹平泽忧之间的感情。但如果你仔细听，会发现这首歌写的不只是姐妹——它写的是轻音部里那种「像家人一样」的关系。',
  body:[
    {h:'一、文化祭前的危机：唯把嗓子唱哑了', p:[
      '《U&I》的诞生，始于一场小小的危机。',
      '第二季文化祭前夕，轻音部正在为演出做最后的准备。但就在这个时候，主唱平泽唯因为练习过度，把嗓子唱哑了。',
      '这对一个乐队来说，是最糟糕的情况——演出在即，主唱却发不出声音。轻音部当时面临两个选择：要么取消演出，要么让别人代替唯唱歌。',
      '但作品没有让事情往「戏剧化」的方向发展。唯没有因为嗓子哑了就崩溃，其他人也没有因为主唱失声就慌乱。她们只是很日常地讨论了一下：「那怎么办？」「让澪唱吧？」「不要啦——」然后决定：让唯先休息，澪临时担任主唱。',
      '这种处理方式很《轻音少女》。它不制造危机，不制造冲突，只是把一件本来可能很严重的事，用最日常的方式化解了。',
      '而唯，因为嗓子哑了，被妈妈勒令在家休息。也就是在这段休息的时间里，她写下了《U&I》。']},
    {h:'二、「U&I」的诞生：唯在病床上写的歌', p:[
      '唯写歌这件事本身，就很不寻常。',
      '在轻音部里，写歌词的人通常是秋山澪。澪是那种会把少女心事写在笔记本里、然后藏起来不给人看的类型。她的歌词细腻、含蓄、带着一点青春期的羞涩。',
      '而唯，是那种连作业都要妹妹代写的人。她平时迷迷糊糊、丢三落四，看起来完全不像会写歌的人。',
      '但就是这样一个唯，在感冒住院的时候，躺在病床上，拿起笔，写下了《U&I》的歌词。',
      '这件事的特别之处在于：唯不是为了「写歌」而写歌。她是因为在病床上没事做，又因为生病的时候特别想念妹妹，所以自然而然地写下了这些话。她不是在「创作」，她是在「倾诉」。',
      '这也是为什么《U&I》的歌词和澪写的歌词完全不一样。澪的歌词是「文学」的，唯的歌词是「生活」的。澪会写「与你一同眺望的风景，虽然早已司空见惯」，而唯会写「キミがいないと 何もできないよ」——你不在的话，我什么都做不了。',
      '这种直白，是唯的风格。她不会拐弯抹角，不会用比喻，她只会直接说：我需要你，我感谢你，我喜欢你。']},
    {h:'三、歌词解析：「你给予我的一切」', p:[
      '《U&I》的歌词，是全作最「直白」的歌词之一。',
      '歌的开头是这样的：「キミがいないと 何もできないよ キミのごはんが食べたいよ」——你不在的话，我什么都做不了，好想吃你做的饭。',
      '这两句歌词，把唯和忧之间的关系说得清清楚楚。唯是那种离了妹妹就活不下去的姐姐——早上起床要忧叫，作业要忧代写，饭盒要忧准备，甚至连头发都是忧帮她剪的。',
      '而忧，就是那种什么都能做好的妹妹。她温柔、细心、能干，把姐姐照顾得无微不至。她做的饭，是唯最喜欢吃的东西。',
      '接下来的一段更直接：「もしもキミが帰ってきたら とびきりの笑顔で 抱きしめる」——如果你回来了，我会用最灿烂的笑容拥抱你。',
      '这句歌词写的是唯在病床上的心情。她因为感冒住院，不能和忧在一起，所以特别想念忧。她想象着忧来探病的时候，自己会用最开心的笑容迎接她。',
      '而全歌最核心的一句，是副歌里的「ありがとう ありがとう キミに出会えたこと それだけで 私は 幸せになれる」——谢谢，谢谢，能遇到你，光是这一点，我就能变得幸福。',
      '这句歌词，是唯对忧说的「谢谢」。但它不只是谢谢忧照顾她，更是谢谢忧存在于这个世界上。对唯来说，忧的存在本身，就是一件值得感谢的事。']},
    {h:'四、平泽姐妹：忧的「姐姐观察日记」', p:[
      '要理解《U&I》，必须先理解平泽姐妹之间的关系。',
      '平泽唯和平泽忧，是一对性格完全相反的姐妹。姐姐唯天然呆、迷迷糊糊、什么都做不好；妹妹忧温柔细心、精明能干、什么都能做好。',
      '在大多数作品里，这种设定会导致一种「姐姐依赖妹妹」的单向关系。但《轻音少女》处理得更细腻。',
      '忧对唯的感情，不只是「照顾」，还有「观察」和「欣赏」。她有一个很有趣的习惯——写「姐姐观察日记」。她会在日记里记录唯的各种「笨蛋行为」，比如「今天姐姐又把袜子穿反了」「今天姐姐忘记带饭盒了」「今天姐姐在电车上睡着了坐过站了」。',
      '这个设定看起来像是在「吐槽」姐姐，但实际上，它表达的是一种更深的感情。忧写这些日记，不是因为她觉得姐姐笨，而是因为她觉得姐姐「可爱」。她喜欢观察姐姐，喜欢记录姐姐的各种糗事，因为在她眼里，姐姐的每一个「笨蛋行为」都是可爱的。',
      '而唯对忧的感情，也不只是「依赖」。她虽然看起来什么都做不好，但她在关键时刻，会做出让忧感动的事。比如《U&I》这首歌——唯在病床上写下这首歌，就是为了告诉忧：「我知道你一直在照顾我，我很感谢你。」',
      '这种双向的感情，让平泽姐妹的关系超越了普通的「姐妹」。她们更像是彼此的「第一个朋友」——在认识任何人之前，她们就已经认识了彼此，已经在一起生活了十几年。']},
    {h:'五、轻音部里的「家人」关系', p:[
      '《U&I》虽然写的是平泽姐妹，但它在轻音部的语境里，表达的是一种更广泛的感情——轻音部成员之间那种「像家人一样」的关系。',
      '轻音部的五个人，在一起度过了两年的时间。她们每天放学后都聚在那间音乐室里，一起喝茶、一起吃蛋糕、一起练琴、一起发呆、一起吵架又和好。',
      '这种高密度的相处，让她们之间的关系超越了普通的「朋友」。朋友是可以选择见或不见的，但「家人」是每天都要见面的。轻音部的五个人，就像家人一样，每天都在一起，分享彼此的日常。',
      '而《U&I》这首歌，在文化祭的舞台上被五个人一起演唱的时候，它的意义就发生了扩展。它不只是唯唱给忧的，也是五个人唱给彼此的。',
      '因为在轻音部里，每个人都在被其他人「照顾」。唯被忧照顾，也被澪、律、紬、梓照顾；澪被律「拉着走」，也被其他人保护；律被澪「管着」，也被其他人依赖；紬照顾所有人，也被所有人接纳；梓被四个学姐「宠着」，也在照顾这个社团。',
      '这种互相照顾、互相依赖的关系，就是「家人」的本质。而《U&I》唱的，就是对这种关系的感谢。']},
    {h:'六、紬的视角：大小姐在轻音部找到了什么', p:[
      '在轻音部的五个人里，琴吹紬是最特别的一个。',
      '她出身大财阀，家里有别墅、有司机、有私人厨师。她从小过着大小姐的生活，什么都不缺。但她加入轻音部的原因，恰恰是因为她「什么都不缺」——她想体验「普通女高中生的生活」。',
      '而轻音部给了她这种体验。在轻音部里，她不是「琴吹家的大小姐」，她只是「紬」——一个和大家一起喝茶、一起吃蛋糕、一起练琴、一起发呆的普通女高中生。',
      '从紬的视角看《U&I》，会有不一样的感受。这首歌里唱的「キミがいないと 何もできないよ」——你不在的话，我什么都做不了——对紬来说，是一种全新的体验。',
      '因为在加入轻音部之前，紬是什么都能做的。她有钱、有能力、有资源，几乎没有什么是她做不到的。但在轻音部里，她第一次体验到了「依赖别人」的感觉——她依赖唯的天然、依赖澪的认真、依赖律的活力、依赖梓的努力。',
      '这种「依赖」对紬来说，是一种解放。她不需要再做那个「什么都能做好的大小姐」，她可以做一个「什么都做不好也没关系」的普通女孩。而这种解放，是轻音部给她的，也是那四个人给她的。',
      '所以当紬在舞台上唱《U&I》的时候，她唱的不只是唯对忧的感谢，也是她自己对轻音部的感谢——感谢这个地方，让她找到了「普通」的幸福。']},
    {h:'七、「U&I」在音乐上的特别之处', p:[
      '除了歌词，《U&I》在音乐上也有很多值得说的地方。',
      '首先是它的作曲。和轻音部大多数原创曲一样，《U&I》的作曲者是琴吹紬。紬的作曲风格有一个很明显的特点——「简单但好听」。她不会写复杂的和弦进行，不会写花哨的旋律，她写的都是最简单、最朗朗上口的曲子。',
      '《U&I》就是一个典型的例子。它的旋律非常简单，几乎是一听就能记住的类型。但正是这种简单，让它的情感表达更加直接——不需要复杂的编曲来「烘托」情绪，旋律本身就已经足够动人。',
      '其次是它的编曲。《U&I》的编曲有一个很特别的设计——在副歌部分，五个人的声音会叠加在一起，形成一种「合唱」的效果。这种设计在轻音部的其他歌曲里也有，但在《U&I》里特别明显。',
      '这种「合唱」的效果，恰好呼应了歌词的主题——「U&I」不是一个人对另一个人的感谢，而是一群人对彼此的感谢。五个人的声音叠加在一起，就像五个人的感情叠加在一起，形成了一种「我们」的感觉。',
      '最后是它的节奏。《U&I》是一首中速的、略带摇摆感的歌。它不是那种快节奏的、让人想跳舞的歌，也不是那种慢节奏的、让人想哭的歌。它的节奏刚刚好——像两个人在一起散步的速度，不急不缓，稳稳当当。',
      '这种节奏，恰好对应了「家人」的感觉。家人之间的感情，不是那种轰轰烈烈的、激情四射的，而是那种平平淡淡的、细水长流的。《U&I》的节奏，就是这种「细水长流」的节奏。']},
    {h:'八、这首歌为什么是全作最「温柔」的一曲', p:[
      '在《轻音少女》的所有歌曲里，《U&I》通常被认为是最「温柔」的一曲。',
      '这种「温柔」不是来自编曲，也不是来自演唱，而是来自它的「视角」。',
      '《轻音少女》的大多数歌曲，视角都是「我」——我的心情、我的感受、我的想法。比如《ふわふわ時間》写的是「我」对暗恋对象的心情，《Don’t say “lazy”》写的是「我」对偷懒的辩护。',
      '但《U&I》的视角是「我们」——我和你，我们两个人。它不是在说「我怎么样」，而是在说「我们怎么样」。它的主语不是「我」，而是「U&I」——你和我。',
      '这种视角的转换，让这首歌的感情变得不一样。它不是「我感谢你」的单向感谢，而是「我们互相感谢」的双向感谢。它不是「我需要你」的单向依赖，而是「我们互相需要」的双向依赖。',
      '而这种「双向」的感情，就是最温柔的感情。因为它不是一方在付出、另一方在接受，而是双方都在付出、都在接受。它是平等的、互相的、温暖的。',
      '这也是为什么《U&I》能让那么多人觉得「温柔」。因为它表达的，是每个人都渴望的那种感情——被一个人需要，同时也需要那个人；被一个人感谢，同时也感谢那个人。这种感情，就是「家人」的感情。']},
    {h:'九、从「U&I」看轻音部的情感内核', p:[
      '《U&I》虽然只是轻音部众多歌曲中的一首，但它其实揭示了整部作品的情感内核。',
      '《轻音少女》的情感内核是什么？不是「音乐」，不是「梦想」，不是「青春」，而是「关系」——人和人之间的关系。',
      '整部作品从头到尾，都在讲同一件事：几个普通的女孩子，因为一个偶然的契机聚在一起，然后在日复一日的相处中，建立了一种像家人一样的关系。',
      '这种关系，不是靠什么惊天动地的事件建立的，而是靠无数个平淡的日常建立的——一起喝茶、一起吃蛋糕、一起发呆、一起吵架、一起和好。这些日常看起来微不足道，但正是它们，让五个人之间的关系变得牢不可破。',
      '而《U&I》这首歌，就是对这种关系的一次总结。它说：「你不在的话，我什么都做不了」——这是依赖；「如果你回来了，我会用最灿烂的笑容拥抱你」——这是期待；「能遇到你，光是这一点，我就能变得幸福」——这是感谢。',
      '依赖、期待、感谢——这三种感情，构成了「家人」的全部。而轻音部的五个人，对彼此都怀有这三种感情。这就是为什么她们的关系那么牢固、那么温暖、那么让人羡慕。',
      '从这个角度看，《U&I》不只是一首歌，它是整部《轻音少女》的「情感宣言」。它用最直白的语言，说出了这部作品最核心的东西：人和人之间的关系，才是最珍贵的宝物。']},
    {h:'十、尾声：你是我，我是你', p:[
      '《U&I》这个标题，本身就很有意思。',
      '它不是「You & Me」——你和我，而是「U & I」——U和I。在英语里，「U」和「I」是两个字母，但在这首歌里，它们是两个人——你和我。',
      '但更有意思的是，「U」和「I」在形状上是对称的。U是一个向下凹的形状，I是一条直线。它们看起来不一样，但放在一起，就形成了一种平衡——U的凹，恰好容纳了I的直。',
      '这种形状上的对称，恰好对应了平泽姐妹的关系。唯和忧，性格完全相反——唯是「凹」的，她迷糊、依赖、需要被照顾；忧是「直」的，她细心、能干、照顾别人。她们看起来不一样，但放在一起，就形成了一种完美的平衡。',
      '而这种平衡，就是「U&I」的真正含义——你和我，虽然不一样，但在一起，就是完整的。',
      '这也是《轻音少女》想说的：每个人都是不完整的，但当你遇到那个能和你互补的人——不管是姐妹、朋友、还是恋人——你就变得完整了。而那种「变得完整」的感觉，就是幸福。',
      '所以，「U&I」不只是一首歌的标题，它是一种关系的定义——你是我的另一半，我是你的另一半，我们在一起，就是完整的。']}
  ]}

{ id:'article_fuwafuwa', key:'article_fuwafuwa', ja:'ふわふわ時間', zh:'轻飘飘时间',
  date:'2026-10-08', tag:'歌曲创作考据', read:'约 15 分钟', ic:'note', c:'#FFB7C5',
  title:'「ふわふわ時間」的诞生——从澪的笔记本到文化祭舞台',
  lead:'《ふわふわ時間》是《轻音少女》全作最具代表性的歌曲。它出现在第一季文化祭，是轻音部第一次站上真正舞台时表演的曲子。但这首歌的诞生过程，远比舞台上的三分钟要长——它始于秋山澪藏在书包里的一本笔记本，经过了无数次的修改、练习和争吵，最后才变成了我们听到的那个样子。',
  body:[
    {h:'一、轻音部的第一首「原创曲」', p:[
      '在《轻音少女》的世界观里，轻音部演奏的大多数歌曲都是「翻唱」——她们练习的曲目，大多是当时流行的乐队歌曲，比如 The Pillows 的《Ride on shooting star》之类。',
      '但《ふわふわ時間》不一样。它是轻音部的第一首「原创曲」——由成员自己作词、自己作曲、自己编曲的歌。',
      '这件事在轻音部的历史上，是一个里程碑。因为它意味着，轻音部不再只是一个「玩乐器的社团」，而是一个真正的「乐队」——她们有了自己的歌，有了自己的声音，有了自己的身份。',
      '而这首歌的诞生过程，本身就是一个很好的故事。它不是某一天突然就写出来的，而是经过了很长时间的酝酿、修改和磨合。']},
    {h:'二、澪的歌词本：那些不敢给人看的少女心事', p:[
      '《ふわふわ時間》的词作者，是秋山澪。',
      '澪有一个习惯——写歌词。她会把自己的少女心事写在一个笔记本里，然后藏在书包的最深处，不给任何人看。',
      '这个笔记本，是澪的「秘密花园」。里面写的，都是她平时不敢说出口的话——对暗恋对象的心情、对自己的不自信、对未来的迷茫。这些话，她只会写在纸上，不会说给任何人听。',
      '《ふわふわ時間》的歌词，就来自这个笔记本。但它不是澪「专门」为轻音部写的，而是她平时随手写的一段文字，后来被律发现了，然后「强行」拿来当歌词。',
      '这个过程很有意思。澪本来是不愿意把自己的歌词给人看的——她觉得太害羞了。但律不管这些，她直接从澪的书包里翻出了笔记本，然后大声念了出来。',
      '澪当时的反应是「不要念啦——」，脸涨得通红。但其他人听完之后，都说「写得很好啊」「就用这个当歌词吧」。于是，澪的「秘密」就这么变成了轻音部的第一首原创曲的歌词。',
      '这个设定背后，其实是作品对「创作」的一种理解：好的作品，往往不是「为了创作而创作」的，而是「为了表达而表达」的。澪的歌词之所以好，不是因为她刻意去写了一首好歌词，而是因为她写的是自己真实的心情。']},
    {h:'三、作曲者紬：大小姐的音乐天赋', p:[
      '《ふわふわ時間》的曲作者，是琴吹紬。',
      '紬在轻音部里，通常被认为是「最会音乐」的人。她从小学钢琴，有扎实的古典音乐基础，对和弦、旋律、编曲都有很好的感觉。',
      '但紬的作曲方式，和一般的「音乐人」不太一样。她不是坐在钢琴前，一个音一个音地推敲，而是「随手就弹出来了」。',
      '在动画里，有一个很经典的场景：澪把歌词给大家看了之后，紬说「我来作曲吧」，然后坐到键盘前，随手弹了一段旋律。那段旋律，就是《ふわふわ時間》的主旋律。',
      '其他人听完之后，都说「好好听」「就是这个感觉」。于是，曲子就这么定了。',
      '这个场景看起来很简单，但它其实展示了紬的音乐天赋——她不需要反复推敲，不需要修改几十遍，她只需要「听一下歌词的感觉」，就能弹出最匹配的旋律。',
      '这种天赋，来自她多年的钢琴训练，也来自她对「音乐和文字之间的关系」的敏锐感知。她能从歌词的语气里，听出应该用什么样的旋律、什么样的节奏、什么样的和弦。',
      '而《ふわふわ時間》的旋律，之所以那么「轻飘飘」，就是因为紬从澪的歌词里，听出了那种「少女心事轻飘飘」的感觉，然后用旋律把它表达了出来。']},
    {h:'四、「ふわふわ」是什么意思', p:[
      '《ふわふわ時間》这个标题，本身就很有意思。',
      '「ふわふわ」是一个日语拟态词，形容「轻飘飘」「松软」「蓬松」的感觉。它可以用来形容棉花糖、云朵、蛋糕的奶油，也可以用来形容心情——那种「轻飘飘的、不踏实的、像在做梦一样」的心情。',
      '在这首歌里，「ふわふわ」形容的是「时间」——轻飘飘的时间。',
      '这个说法看起来很奇怪——时间怎么会是「轻飘飘」的呢？时间不是应该是「沉重的」「无情的」「一去不复返的」吗？',
      '但在轻音部的语境里，时间确实是「轻飘飘」的。因为轻音部的时间，不是那种「争分夺秒」的时间，而是那种「无所事事」的时间——喝茶、吃蛋糕、发呆、聊天，时间就这么轻飘飘地过去了。',
      '而这种「轻飘飘的时间」，恰恰是青春最美好的部分。因为在青春里，时间是「多余」的——你有大把的时间可以浪费，可以无所事事，可以和喜欢的人一起发呆。这种「浪费时间」的感觉，就是「ふわふわ」的感觉。',
      '所以，《ふわふわ時間》这个标题，其实是对「青春」的一种定义——青春，就是一段轻飘飘的、可以浪费的、和喜欢的人一起度过的时间。']},
    {h:'五、从练习室到文化祭舞台的距离', p:[
      '《ふわふわ時間》虽然写出来了，但要把它「演好」，并不是一件容易的事。',
      '轻音部当时的水平，只能用「业余」来形容。唯刚学吉他没多久，连和弦都按不熟练；律虽然打鼓很久了，但节奏感时好时坏；澪的贝斯还算稳定，但她一上台就紧张；紬的键盘最稳，但她一个人稳没用。',
      '所以，从「写出这首歌」到「在文化祭上表演这首歌」，中间隔了很长的一段练习时间。',
      '这段练习时间，作品没有用「蒙太奇」的方式一笔带过，而是用了很多日常的细节来展示——唯练和弦练到手指起泡，律打鼓打到胳膊酸，澪反复调整贝斯的音色，紬一遍一遍地确认和弦的进行。',
      '这些细节看起来很琐碎，但它们其实是在做一件很重要的事——让观众相信，轻音部的演出不是「随便玩玩」的，而是经过了认真的准备的。',
      '而从练习室到文化祭舞台的距离，也不只是「技术」的距离，更是「心理」的距离。在练习室里，她们可以出错，可以重来，可以笑场。但在文化祭的舞台上，台下坐着几百个观众，没有重来的机会。',
      '这种「心理距离」，对澪来说尤其大。她是全团最怕上台的人，一想到要在那么多人面前演奏，她就紧张得想逃。但最后，她还是站上了舞台——因为她不想让大家的努力白费。',
      '而当她们在文化祭的舞台上，真正演奏出《ふわふわ時間》的时候，那种「从练习室到舞台」的距离感，就变成了一种「成长」的感觉——她们做到了，她们真的做到了。']},
    {h:'六、编曲的细节：五个人各自的乐器在说什么', p:[
      '《ふわふわ時間》的编曲，虽然简单，但每一件乐器都有自己的「角色」。',
      '首先是吉他。唯的吉他在这首歌里，主要负责「节奏」——扫弦，提供歌曲的基本律动。唯的扫弦风格很有特点，她不是那种「精准」的扫弦，而是带一点「随意」的感觉，有时候会快一点，有时候会慢一点。但正是这种「随意」，让歌曲听起来更「轻飘飘」。',
      '其次是贝斯。澪的贝斯在这首歌里，负责「低音」——和鼓一起，构成歌曲的节奏骨架。澪的贝斯风格很「稳」，她不会弹花哨的乐句，只会踏踏实实地弹根音。但正是这种「稳」，让歌曲有了一个坚实的底座。',
      '然后是鼓。律的鼓在这首歌里，负责「节奏」——用鼓点推动歌曲前进。律的鼓风格很「活泼」，她会在歌曲的间隙加一些小装饰，比如踩镲的变化、军鼓的加花。这些小装饰，让歌曲听起来更有「生气」。',
      '接着是键盘。紬的键盘在这首歌里，负责「和声」和「装饰」——用和弦铺垫歌曲的色彩，用旋律装饰歌曲的间隙。紬的键盘风格很「细腻」，她会在歌曲的关键位置加一些小小的旋律装饰，比如副歌前的一个上行音阶、间奏里的一段琶音。这些装饰，让歌曲听起来更「丰富」。',
      '最后是主唱。唯的主唱在这首歌里，负责「旋律」和「情感」——用声音传达歌曲的感觉。唯的演唱风格很「天然」，她不会用复杂的演唱技巧，只会用最自然的声音去唱。但正是这种「天然」，让歌曲听起来更「真诚」。',
      '五件乐器，五个角色，合在一起，就构成了《ふわふわ時間》的完整声音。每一件乐器都在「说话」，但它们说的是同一句话——「轻飘飘的时间，真美好」。']},
    {h:'七、这首歌在轻音部历史上的位置', p:[
      '《ふわふわ時間》在轻音部的历史上，占据着一个非常特殊的位置。',
      '它是轻音部的第一首原创曲，也是轻音部第一次在文化祭上表演的曲子。它标志着轻音部从「一个凑数的社团」变成了「一个真正的乐队」。',
      '但更重要的是，它是轻音部「身份」的象征。在后来的演出里，轻音部表演过很多歌曲——有欢快的，有温柔的，有摇滚的，有抒情的。但每当她们表演《ふわふわ時間》的时候，观众都会特别兴奋——因为这首歌，是「轻音部的歌」。',
      '在剧场版里，轻音部在伦敦的舞台上，又一次表演了《ふわふわ時間》。这一次，她们的演奏水平已经比第一季时高了很多，但歌曲的感觉没有变——还是那种轻飘飘的、温暖的、让人想微笑的感觉。',
      '这个细节很有意思。它说明，《ふわふわ時間》不只是一首歌，它是轻音部的「原点」。无论她们走了多远，无论她们的水平提高了多少，只要她们演奏这首歌，她们就回到了最初的那个样子——四个（后来是五个）普通的女孩子，在一间音乐室里，因为喜欢音乐而聚在一起。',
      '从这个角度看，《ふわふわ時間》是轻音部的「国歌」。它不是最好听的歌，不是最复杂的歌，不是最有名的歌，但它是最「轻音部」的歌。']},
    {h:'八、「ふわふわ時間」的多个版本', p:[
      '《ふわふわ時間》在《轻音少女》的历史上，有很多个版本。',
      '首先是「TV版」——也就是第一季文化祭上表演的版本。这个版本是最「原始」的版本，编曲简单，演奏略带生涩，但充满了「第一次上台」的紧张和兴奋。',
      '然后是「Full版」——也就是CD里收录的完整版本。这个版本比TV版长，有完整的主歌、副歌、间奏、尾奏，编曲也更丰富。',
      '还有「5人版」——也就是梓加入之后的版本。在第一季里，轻音部是四个人（唯、澪、律、紬），梓是在第一季最后才加入的。所以第一季文化祭上的《ふわふわ時間》是四人版。而在第二季和剧场版里，轻音部是五个人，所以《ふわふわ時間》也有了五人版——多了一把第二吉他（梓），编曲更丰满。',
      '此外还有「现场版」——也就是演唱会里表演的版本。在轻音部的声优演唱会上，《ふわふわ時間》通常是安可曲，全场观众一起合唱，气氛非常热烈。',
      '还有「伴奏版」——也就是没有人声的纯乐器版本。这个版本通常用来让粉丝「卡拉OK」，或者用来分析编曲的细节。',
      '甚至还有「分乐器版」——也就是只有某一件乐器的版本。比如「无吉他版」「无贝斯版」「无键盘版」「无鼓版」。这些版本通常用来让粉丝练习某一件乐器，或者用来分析某一件乐器在编曲中的作用。',
      '这么多版本的存在，说明《ふわふわ時間》确实是一首「经得起反复听」的歌。每一个版本，都有它自己的特点和魅力。']},
    {h:'九、为什么这首歌成了全作的代名词', p:[
      '在《轻音少女》的所有歌曲里，《ふわふわ時間》通常被认为是「全作的代名词」。',
      '为什么是这首歌，而不是其他歌？比如《Cagayake!GIRLS》是第一季的OP，知名度很高；《Don’t say “lazy”》是第一季的ED，也很有名；《U&I》很温柔，《天使にふれたよ!》很催泪。',
      '但《ふわふわ時間》之所以能成为「全作的代名词」，是因为它最能代表《轻音少女》的「本质」。',
      '《轻音少女》的本质是什么？不是「音乐」，不是「梦想」，不是「青春」，而是「日常」——几个普通的女孩子，在普通的日常里，认真地对待彼此。',
      '而《ふわふわ時間》，就是对这种「日常」的最好表达。它的旋律轻飘飘的，像日常一样「不沉重」；它的歌词写的是少女心事，像日常一样「不宏大」；它的编曲简单，像日常一样「不复杂」。',
      '但正是这种「不沉重、不宏大、不复杂」，让它变得特别。因为日常本身就是「不沉重、不宏大、不复杂」的——日常就是喝茶、吃蛋糕、发呆、聊天，就是这些看起来微不足道的小事。',
      '而《ふわふわ時間》，把这些「微不足道的小事」，变成了一首好听的歌。它告诉观众：日常不是「浪费时间」，日常本身就是最珍贵的东西。',
      '这就是为什么《ふわふわ時間》能成为全作的代名词——因为它不只是一首歌，它是《轻音少女》这部作品的「精神」。']},
    {h:'十、尾声：轻飘飘的时间，沉甸甸的回忆', p:[
      '回到《ふわふわ時間》这首歌本身。',
      '它的标题是「轻飘飘的时间」，但它在观众心里留下的，却是「沉甸甸的回忆」。',
      '因为每一个听过这首歌的人，都会想起自己的「轻飘飘的时间」——那段可以浪费的、可以无所事事的、和喜欢的人一起度过的青春。',
      '那段时间，在当时看起来是「轻飘飘」的——你觉得时间多得用不完，觉得日子会一直这样持续下去，觉得那些人和那些事，永远都不会变。',
      '但当你回头看的时候，才发现那段时间是「沉甸甸」的——它承载了你最美好的回忆，最珍贵的感情，最真实的自己。',
      '而《ふわふわ時間》，就是把这种「轻飘飘」和「沉甸甸」之间的反差，用一首歌表达了出来。它用轻飘飘的旋律，唱着沉甸甸的回忆。',
      '这就是这首歌的力量。它不只是一首歌，它是一把钥匙，打开了每个人心里那段被叫做「青春」的回忆。而那段回忆，虽然已经过去了，但它永远都是「轻飘飘」的——因为它是你人生中最轻松、最美好、最无忧无虑的一段时光。']}
  ]},
{ id:'article_kyoani', key:'article_kyoani', ja:'日常の美学', zh:'日常的美学',
  date:'2026-10-08', tag:'制作分析', read:'约 16 分钟', ic:'teacup', c:'#8B7355',
  title:'京都动画的「日常美学」——为什么轻音少女的每一杯茶都让人想哭',
  lead:'《轻音少女》里有一个很奇怪的现象：明明什么都没发生，观众却看得津津有味；明明只是几个女孩子在喝茶，观众却突然就哭了。这种「无事发生却动人」的效果，不是偶然的，而是京都动画经过多年探索形成的一套「日常美学」。这套美学的核心，是把「日常」从「背景」提升为「主角」，让每一杯茶、每一块蛋糕、每一个发呆的瞬间，都变成有意义的叙事。',
  body:[
    {h:'一、「京都动画」这四个字意味着什么', p:[
      '在日本动画业界，「京都动画」（Kyoto Animation，简称「京阿尼」）这四个字，意味着一种品质的保证。',
      '京阿尼不是那种「量产型」的动画公司。它一年只做很少的几部作品，但每一部都经过了精心的制作。它的作画质量、演出水平、叙事节奏，在业界都是顶尖的。',
      '但京阿尼最特别的地方，不是「技术好」，而是「审美好」。它对「什么是好的动画」有自己的一套理解，而且这套理解和大多数动画公司都不一样。',
      '大多数动画公司认为，好的动画需要「强剧情」「强冲突」「强角色」——要有悬念，要有反转，要有高潮，要有让观众「停不下来」的力量。',
      '但京阿尼不这么认为。京阿尼认为，好的动画不一定需要「强剧情」——它可以是「弱剧情」的，甚至是「无剧情」的。它不需要让观众「停不下来」，它只需要让观众「舍不得离开」。',
      '这种审美，在《轻音少女》里得到了最充分的体现。《轻音少女》几乎没有剧情——没有反派，没有冲突，没有悬念，没有反转。它只是记录了几个女孩子的日常。但就是这样一部「什么都没发生」的动画，却让无数观众看得津津有味，甚至哭了出来。',
      '这就是京阿尼的「日常美学」——它不依赖剧情来吸引观众，它依赖「氛围」来留住观众。它让观众不是「想知道接下来发生了什么」，而是「想再多看一会儿这些人的日常」。']},
    {h:'二、「日常系」动画的崛起与轻音少女的位置', p:[
      '要理解《轻音少女》的特殊性，需要把它放在「日常系」动画的历史里来看。',
      '「日常系」动画，是日本动画里一个很特别的分类。它的特点是：没有强剧情，没有强冲突，主要角色是一群普通人，故事发生在日常生活中，重点是「角色之间的互动」和「日常的氛围」。',
      '日常系动画的起源，可以追溯到2000年代初。当时，《阿滋漫画大王》《草莓棉花糖》等作品，开始探索「没有剧情的动画」这种形式。但这些作品，更多的是「搞笑向」的——它们靠角色的「奇葩行为」来制造笑点。',
      '真正让日常系动画「升华」的，是2009年的《轻音少女》。',
      '《轻音少女》和之前的日常系动画最大的不同，是它不依赖「搞笑」来吸引观众。它的角色不是「奇葩」，而是「普通人」——她们不会做出什么夸张的行为，她们只是喝茶、吃蛋糕、练琴、发呆。',
      '但正是这种「普通」，让《轻音少女》变得特别。因为观众在这些「普通」的角色身上，看到了自己的影子——自己的青春，自己的朋友，自己的日常。',
      '《轻音少女》之后，日常系动画进入了一个「黄金时代」。《摇曳百合》《悠哉日常大王》《请问您今天要来点兔子吗？》等作品，都受到了《轻音少女》的影响。但这些作品，大多只学到了《轻音少女》的「形」——可爱的角色、温馨的氛围——而没有学到它的「神」——对「日常」本身的深刻理解。',
      '从这个角度看，《轻音少女》是日常系动画的「巅峰」之一。它不只是一部好看的日常系动画，它是对「日常」这件事的一次深刻思考。']},
    {h:'三、为什么是「茶」而不是「音乐」', p:[
      '《轻音少女》的标题里有「轻音」两个字，海报上有乐器，角色是一个乐队。但如果你仔细看，会发现这部动画里，「音乐」的戏份其实很少。',
      '大多数集数里，轻音部的成员们不是在练琴，而是在喝茶。她们到了音乐室，第一件事不是拿出乐器，而是拿出茶具——烧开水、泡茶、拿蛋糕、围坐在一起聊天。练琴？那是茶喝完了之后才偶尔做的事。',
      '这个设定，是《轻音少女》最核心的「反套路」。',
      '在传统的「乐队题材」动画里，音乐是绝对的主角。角色们为了音乐而努力，为了演出而奋斗，为了梦想而拼搏。音乐是她们的「信仰」，是她们的「一切」。',
      '但《轻音少女》不这么认为。在《轻音少女》里，音乐不是「信仰」，而是「借口」——是几个女孩子聚在一起的借口。她们真正在乎的，不是音乐，而是「和彼此在一起」。',
      '而「茶」，就是这种「在一起」的象征。茶是一种「仪式」——它需要时间，需要耐心，需要大家坐下来，慢慢喝。它不是「快速」的，不是「高效」的，它是「浪费时间」的。',
      '但正是这种「浪费时间」，让茶变成了《轻音少女》里最重要的东西。因为轻音部的成员们，最珍惜的就是「可以浪费的时间」——和喜欢的人一起，无所事事地度过一个下午。',
      '所以，《轻音少女》的主角不是「音乐」，而是「茶」。茶是这部动画的「灵魂」——它代表了日常、温暖、陪伴、和「在一起」的幸福。']},
    {h:'四、细节的力量：京阿尼的「过度作画」', p:[
      '京阿尼的动画，有一个很著名的特点——「过度作画」。',
      '所谓「过度作画」，是指京阿尼会在一些「不重要」的地方，投入大量的作画资源。比如，一个角色倒茶的动作，京阿尼会画十几帧——从拿起茶壶，到倾斜茶壶，到茶水流出，到茶杯满了，到放下茶壶，每一个细节都画得清清楚楚。',
      '在大多数动画公司看来，这种「过度作画」是「浪费」——倒茶这种动作，画两三帧就够了，观众不会注意到的。但京阿尼不这么认为。京阿尼认为，正是这些「不重要」的细节，构成了动画的「真实感」和「沉浸感」。',
      '在《轻音少女》里，这种「过度作画」随处可见。唯弹吉他的时候，手指按弦的位置是准确的——她按的和弦，和画面里听到的声音是一致的。律打鼓的时候，鼓槌的运动轨迹是准确的——她打的节奏，和画面里听到的节奏是一致的。澪弹贝斯的时候，左手把位的变化是准确的——她弹的音符，和画面里听到的音符是一致的。',
      '这些细节，大多数观众是不会注意到的。但它们会在潜意识里，让观众觉得「这个乐队是真的在演奏」，而不是「在摆样子」。这种「真实感」，是《轻音少女》能让观众「相信」的基础。',
      '除了乐器演奏，京阿尼在「日常动作」上的「过度作画」更是令人发指。紬倒茶的时候，茶水的流动是有「重量」的——它不是一条直线，而是有弧度、有速度变化的。唯吃蛋糕的时候，蛋糕的「口感」是画出来的——她咬下去的时候，蛋糕会变形，奶油会粘在嘴角。律擦鼓的时候，抹布和鼓面之间的「摩擦」是画出来的——抹布会弯曲，鼓面会有细微的凹陷。',
      '这些细节，单独看都「不重要」。但它们合在一起，就构成了一个「真实的世界」——一个观众可以「走进去」的世界。而这种「真实感」，就是京阿尼「日常美学」的技术基础。']},
    {h:'五、时间感：轻音部里的时间为什么过得不一样', p:[
      '《轻音少女》里有一个很特别的体验：观众在看的时候，会觉得「时间过得很慢」，但看完之后，又会觉得「时间过得很快」。',
      '这种「矛盾」的时间感，是京阿尼精心设计的结果。',
      '首先，京阿尼会「拉长」单个场景的时间。在大多数动画里，一个「喝茶」的场景，可能只持续几十秒——角色们说几句话，茶就喝完了，场景就切换了。但在《轻音少女》里，一个「喝茶」的场景，可能会持续好几分钟——角色们会慢慢泡茶，慢慢倒茶，慢慢吃蛋糕，慢慢聊天，慢慢发呆。每一个动作都被「拉长」了，每一秒都被「填满」了。',
      '这种「拉长」，让观众在看的时候，觉得「时间过得很慢」——因为观众和角色一起，在「慢慢」地度过这段时间。观众不是在「看」角色喝茶，而是在「和」角色一起喝茶。',
      '但与此同时，京阿尼又会「压缩」整体的时间。《轻音少女》两季加起来，讲了两年的故事。但这两年的故事，不是「按时间顺序」讲的，而是「按场景」讲的——每一集是一个或几个场景，场景之间的时间跳跃是很大的。',
      '比如，第一季第一集是春天（唯入学），第二集可能就是夏天（合宿），第三集可能就是秋天（文化祭），第四集可能就是冬天（圣诞节）。时间在「不知不觉」中就过去了。',
      '这种「压缩」，让观众在看完之后，觉得「时间过得很快」——因为观众还没「反应过来」，两年就过去了，角色们就毕业了。',
      '而这种「拉长」和「压缩」的结合，恰好模拟了「青春」的时间感——在青春里，每一天都过得很慢（因为你在「慢慢」地度过），但整个青春却过得很快（因为你还没「反应过来」，它就过去了）。',
      '这就是京阿尼的「时间魔法」——它用动画的时间，模拟了青春的时间，让观众在看动画的时候，重新体验了一次青春。']},
    {h:'六、空间感：那间音乐室的物理设计', p:[
      '《轻音少女》里最重要的「空间」，是那间音乐室。',
      '这间音乐室，不是一个「抽象」的背景，而是一个「具体」的空间——它有明确的物理结构，有固定的家具摆放，有一致的光影方向。京阿尼在设计这间音乐室的时候，是把它当作一个「真实存在的房间」来设计的。',
      '首先是「布局」。音乐室里有一张长桌，放在房间的中央偏左的位置；有一个谱架，靠在墙边；有一台钢琴，放在房间的角落；有一个储物柜，放在门口旁边；有一个窗户，在房间的右侧，下午的阳光会从这里照进来。',
      '这个布局，在每一集中都是一致的——不管镜头怎么切换，不管角色怎么移动，家具的位置都不会变。这种「一致性」，让观众在看了几集之后，就能在脑子里「构建」出这间音乐室的完整空间——观众知道桌子在哪里，窗户在哪里，钢琴在哪里，储物柜在哪里。',
      '其次是「光影」。音乐室的窗户在右侧，所以下午的阳光会从右侧照进来，在地板上投下窗户的影子。这个光影，在每一集中也是一致的——不管是哪一集，只要是下午的场景，阳光的方向和影子的形状都是一样的。',
      '这种「光影的一致性」，让音乐室有了「时间感」——观众看到阳光的角度，就知道现在是下午几点。而这种「时间感」，又强化了「日常感」——因为日常就是由这些重复的、一致的光影构成的。',
      '最后是「细节」。音乐室里有很多「小物件」——桌上的茶杯、茶壶、蛋糕盘；墙角的吉他架、贝斯袋、鼓槌筒；墙上的海报、乐谱、贴纸；地上的拖鞋、垃圾袋、零食袋。这些小物件，在每一集中都会出现，而且位置基本不变。',
      '这些「小物件」，让音乐室有了「生活感」——它不是一个「干净的」「完美的」舞台，而是一个「有人住的」「有生活气息的」房间。而这种「生活感」，就是「日常」的本质。',
      '京阿尼对音乐室的这种「物理设计」，让它从一个「背景」变成了一个「角色」。它不只是角色们活动的场所，它本身就是有「性格」的——温暖、舒适、充满生活气息。而观众在看动画的时候，不只是在看角色，也是在「感受」这间房间。']},
    {h:'七、色彩与光影：樱丘高中的视觉语言', p:[
      '《轻音少女》的视觉风格，有一个很明显的特点——「暖」。',
      '整部动画的色彩，都是偏「暖」的——米白的墙壁，原木的地板，奶茶色的家具，樱粉色的装饰，水色的点缀。没有冷硬的金属色，没有刺眼的霓虹色，没有暗沉的灰色。一切都是「温暖」的、「柔和」的、「治愈」的。',
      '这种「暖」的色彩，不是偶然的，而是京阿尼精心设计的「视觉语言」。',
      '首先，「暖」色对应了「日常」的温度。日常是「温暖」的——它不是「冷酷」的，不是「激烈」的，不是「紧张」的。它是「温和」的、「舒适」的、「放松」的。而「暖」色，恰好能传达这种「温暖」的感觉。',
      '其次，「暖」色对应了「回忆」的滤镜。当人们回忆过去的时候，通常会给回忆加上一层「暖色」的滤镜——回忆里的阳光总是更暖，回忆里的天空总是更蓝，回忆里的人总是更温柔。而《轻音少女》的「暖」色，恰好模拟了这种「回忆的滤镜」——它让观众在看动画的时候，觉得自己是在「回忆」一段美好的过去。',
      '除了色彩，《轻音少女》的光影也很有特点。京阿尼在《轻音少女》里，大量使用了「逆光」和「侧光」——让阳光从角色的背后或侧面照过来，在角色的轮廓上形成一圈「光晕」。',
      '这种「光晕」效果，让角色看起来「闪闪发光」——不是那种「主角光环」的闪闪发光，而是那种「被阳光照亮」的闪闪发光。它让角色看起来更「温柔」、更「美好」、更「值得珍惜」。',
      '而这种「光影」的运用，在「毕业」相关的场景里尤其明显。在第二季最终话里，当唯她们在音乐室里做最后的告别时，阳光从窗户照进来，在她们的身上形成了一圈温暖的光晕。这个画面，没有任何台词，但光是光影，就已经让观众哭了。',
      '这就是京阿尼的「视觉语言」——它不用台词来说「这很感人」，它用色彩和光影来让观众「觉得」这很感人。而这种「不用台词的感动」，往往比「用台词的感动」更有效。']},
    {h:'八、声音设计：沉默与环境音的运用', p:[
      '《轻音少女》的声音设计，也是京阿尼「日常美学」的重要组成部分。',
      '大多数动画的声音设计，是「满」的——背景音乐从头放到尾，角色台词一句接一句，几乎没有「安静」的时候。但《轻音少女》的声音设计，是「空」的——它有大量的「沉默」和「环境音」。',
      '在《轻音少女》里，经常会出现这样的场景：角色们围坐在桌旁，没有人说话，只有茶杯碰撞的声音、窗外的鸟鸣声、风吹树叶的声音、远处的操场广播声。这些「环境音」，填补了「沉默」的空白，让场景不显得「空」，但又保持了「安静」的氛围。',
      '这种「沉默+环境音」的设计，是「日常」的真实写照。在真实的日常里，人们不是一直在说话的——很多时候，人们只是坐在一起，各做各的事，偶尔说几句话，然后又安静下来。这种「安静的陪伴」，是日常里最常见、也最温暖的状态。',
      '而大多数动画，因为害怕「无聊」，会用背景音乐和台词把「安静」填满。但京阿尼不害怕「无聊」——京阿尼知道，「安静」不是「无聊」，「安静」是「日常」的本质。只有允许「安静」存在，才能让观众真正「感受到」日常。',
      '除了「沉默」和「环境音」，《轻音少女》的「音乐」运用也很有特点。在大多数动画里，背景音乐是「引导情绪」的——悲伤的场景放悲伤的音乐，快乐的场景放快乐的音乐，用音乐来「告诉」观众「该哭了」或「该笑了」。',
      '但《轻音少女》的背景音乐，是「衬托氛围」的——它不「引导」情绪，它只是「陪伴」情绪。在悲伤的场景里，它不会放悲伤的音乐来「催泪」，它只会放一段轻轻的钢琴，让观众自己去感受悲伤。在快乐的场景里，它不会放欢快的音乐来「逗笑」，它只会放一段轻快的吉他，让观众自己去感受快乐。',
      '这种「不引导」的音乐设计，让观众的情绪是「自己产生」的，而不是「被音乐引导」的。而「自己产生」的情绪，往往比「被引导」的情绪更真实、更深刻。',
      '这就是京阿尼的「声音美学」——它用「沉默」来让观众「倾听」，用「环境音」来让观众「沉浸」，用「不引导的音乐」来让观众「自己感受」。而这一切，都是为了让观众「真正地」进入那个日常的世界。']},
    {h:'九、「治愈」不是没有痛苦，而是温柔地对待痛苦', p:[
      '《轻音少女》通常被归类为「治愈系」动画。但「治愈」这个词，经常被误解。',
      '很多人认为，「治愈系」就是「没有痛苦」——没有悲伤，没有离别，没有挫折，一切都是美好的、温暖的、快乐的。但这不是「治愈」，这是「逃避」。',
      '真正的「治愈」，不是「没有痛苦」，而是「温柔地对待痛苦」。它承认痛苦的存在——悲伤、离别、挫折，这些都是人生的一部分，无法避免。但它不用「激烈」的方式去对待痛苦，它用「温柔」的方式去对待痛苦。',
      '《轻音少女》就是这样一部「真正的治愈系」动画。它不是「没有痛苦」的——它有毕业的悲伤，有离别的不舍，有成长的烦恼，有失去的痛苦。但它对待这些痛苦的方式，是「温柔」的。',
      '比如「毕业」。在大多数动画里，毕业是一个「激烈」的场景——角色们抱头痛哭，长篇告别，互相承诺「永远在一起」。但在《轻音少女》里，毕业是一个「温柔」的场景——角色们没有抱头痛哭，没有长篇告别，她们只是像平时一样说着话、开着玩笑，然后在某个瞬间，突然安静下来，眼里有了泪光。',
      '这种「温柔」的处理，不是「不悲伤」，而是「悲伤得更真实」。因为在真实的生活里，大多数告别都不是「激烈」的——你不会在机场抱头痛哭，你只会在对方转身离开的时候，突然觉得鼻子一酸，然后默默挥手。',
      '而《轻音少女》，就是把这种「真实的悲伤」画了出来。它不夸大悲伤，也不回避悲伤，它只是「温柔地」把悲伤呈现出来，让观众自己去感受。',

/* 今日の軽音：按日期确定性随机（同一天全站一致） */
function dailyPick(){
  const now = new Date(), seed = now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();
  const rnd = n => { let x = seed % 97; return (x*31+n*17)%97; };
  const song = SONGS[rnd(3) % SONGS.length];
  const qs = CHARACTERS.reduce((a,c)=>a.concat(c.quotes.map(q=>({q,who:c.nameZh}))),[]);
  const q = qs.length ? qs[rnd(7)%qs.length] : {q:{ja:'（台词待补充）',zh:'',who:'',ep:''},who:''};
  return {song, quote:Object.assign({}, q.q, {who: q.who||q.q.who})};
}

/* ---------- 角色生日提醒 ---------- */
function parseBirth(born){
  const m = String(born||'').match(/^(\d{1,2})月(\d{1,2})日/);
  return m ? {mo:+m[1], d:+m[2]} : null;
}
function _dayStart(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function daysUntil(now, mo, d){
  let t = new Date(now.getFullYear(), mo-1, d);
  if(_dayStart(t) < _dayStart(now)) t = new Date(now.getFullYear()+1, mo-1, d);
  return Math.round((_dayStart(t)-_dayStart(now))/86400000);
}
function birthdayInfo(){
  const now = new Date(), tm = now.getMonth()+1, td = now.getDate();
  const list = CHARACTERS.map(c=>{
    const b = parseBirth(c.born);
    return b ? {c, mo:b.mo, d:b.d, days: daysUntil(now, b.mo, b.d)} : null;
  }).filter(Boolean).sort((a,b)=>a.days-b.days);
  return { today: list.filter(x=>x.mo===tm && x.d===td), next: list[0]||null, upcoming: list };
}
function birthdaySection(){
  const {today, next, upcoming} = birthdayInfo();
  if(today.length){
    const names = today.map(x=>x.c.nameZh).join('、');
    return '<div class="kcard p-6 flex items-center gap-4 flex-wrap" style="background:linear-gradient(120deg,rgba(255,107,138,.22),rgba(255,229,153,.22))">'

    + up.map(x=>'<a data-route="/character/'+x.c.id+'" class="rounded-xl p-3 text-center cursor-pointer hover:opacity-80 transition-opacity" style="background:'+x.c.color+'18;border:1px solid '+x.c.color+'44">'

/* 分类张数以 MEDIA 数组实际长度为准：galleryItems() 按 n 截断，
   n 与数组脱节会渲染出空白占位块，这里统一同步，避免两处手工维护 */
GALLERY_CATS.forEach(c=>{ const a = MEDIA['gallery_'+c.id]; if(a && a.length) c.n = a.length; });
/* 图库条目生成（占位；替换 MEDIA.gallery_xxx 数组即可） */
function galleryItems(catId){
  const c = GALLERY_CATS.find(x=>x.id===catId);
  const keys = MEDIA['gallery_'+catId]||[];
  return Array.from({length:c.n}, (_,i)=>{
    const ch = CHARACTERS[i%CHARACTERS.length];
    return { key: 'gallery_'+catId+'['+i+']', url: keys[i]||'', label: c.name+' '+(i+1), char: ch.id, charName: ch.nameZh };
  });
}

/* ============================================================
   ⑧ 路由 ROUTER（SPA 无刷新切换，300ms 淡入淡出+上移）
   ============================================================ */
const Router = {
  current:'/',
  go(route){
    route = route || '/';
    if(route === this.current && !route.includes('#')){ return; }
    const view = $('#view');
    view.classList.add('view-leave');
    clearTimeout(this._t);
    this._t = setTimeout(()=>{
      view.classList.remove('view-leave');
      this.render(route);
      view.classList.add('view-enter');
      setTimeout(()=>view.classList.remove('view-enter'), 320);
    }, 280);
  },
  render(route, fromPop){
    this.current = route;
    /* 更新地址栏 hash：正常导航入栈（支持前进后退）；popstate 回放不改历史 */
    const hash = '#/'+route;
    if(location.hash !== hash){ if(fromPop) history.replaceState(null,'',hash); else history.pushState(null,'',hash); }
    const base = route.split('#')[0];
    let html='';
    let m;
    if(base==='/' ) html = viewHome();
    else if(base==='/characters') html = viewCharacters();
    else if(m=base.match(/^\/character\/(.+)$/)) html = viewCharacter(m[1]);
    else if(base==='/episodes') html = viewEpisodes();
    else if(m=base.match(/^\/episodes\/(.+)$/)) html = viewEpisodesSeason(m[1]);
    else if(m=base.match(/^\/episode\/(.+)$/)) html = viewEpisode(m[1]);
    else if(base==='/music') html = viewMusic();
    else if(m=base.match(/^\/music\/(.+)$/)) html = viewMusicCat(m[1]);
    else if(m=base.match(/^\/song\/(.+)$/)) html = viewSong(m[1]);
    else if(base==='/gallery') html = viewGallery();
    else if(m=base.match(/^\/gallery\/(.+)$/)) html = viewGalleryCat(m[1]);
    else if(base==='/secrets') html = viewSecrets();
    else if(m=base.match(/^\/article\/(.+)$/)) html = viewArticle(m[1]);
    else if(base==='/fun') html = viewFun();
    else if(base==='/goods') html = viewGoods();
    else html = view404();
    $('#view').innerHTML = html;
    renderFooter();
    setNavActive(base);
    setPetals(base==='/' || base==='/music' || base.startsWith('/music'));
    window.scrollTo({top:0});
    /* 页内锚点（考据页 #scene 等） */
    if(route.includes('#')){
      const id = route.split('#')[1];
      setTimeout(()=>{ const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 380);
    }
    /* 路由后初始化子模块 */
    PostRender.init(base);
  }
};

  $$('#topnav .nav-link').forEach(a=>{
    const r = a.getAttribute('data-route')||'';

let bannerIdx=0, bannerTimer=null;
function initBanner(){
  bannerIdx=0; updateBanner();
  clearInterval(bannerTimer);
  bannerTimer = setInterval(()=>bannerGo(1), 5000);
}
function bannerGo(delta){
  const slides=$('#banner-slides'); if(!slides) return;
  const n = slides.children.length;
  bannerIdx = (bannerIdx + delta + n) % n;
  updateBanner();
}
function updateBanner(){
  const slides=$('#banner-slides'); if(!slides) return;
  slides.style.transform = 'translateX(-'+(bannerIdx*100)+'%)';
  $$('#banner .dots button').forEach((d,i)=>d.classList.toggle('on', i===bannerIdx));
}

function initMusicCat(){
  const box=$('#mc-search'), sort=$('#mc-sort');
  if(!box) return;
  const apply = ()=>{
    const kw = (box.value||'').trim().toLowerCase();
    const body=$('#mc-body');
    let list = SONGS.filter(s=>s.cat===CAT_MAP[location.hash.split('/')[2]]);
    if(kw) list = list.filter(s=>(s.t+' '+s.tZh+' '+s.ro+' '+s.unit+' '+s.credit.ly).toLowerCase().includes(kw));
    if(sort && sort.value==='name') list=[...list].sort((a,b)=>a.t.localeCompare(b.t,'ja'));
    if(sort && sort.value==='dur') list=[...list].sort((a,b)=>b.dur-a.dur);
    if(sort && sort.value==='tempo') list=[...list].sort((a,b)=>b.tempo-a.tempo);
    body.innerHTML = list.map(songRow).join('');
  };
  box.addEventListener('input', apply);
  if(sort) sort.addEventListener('change', apply);
}

function initEpSearch(){
  const box=$('#ep-search'); if(!box) return;
  box.addEventListener('input', ()=>{
    const kw=(box.value||'').trim().toLowerCase();
    const sid=location.hash.split('/')[2];
    let list=EPISODES.filter(e=>e.season===sid);
    if(kw) list=list.filter(e=>{

      return hay.includes(kw);
    });

}

          <div class="text-xs text-[var(--txt-2)]">${esc(cur.charName)} · 分辨率：1080P / 2K / 4K（下载链接待补充）</div>
          <button class="btn btn-ghost px-4 py-1.5 text-sm" data-lb-next>下一张 →</button></div>
        <div class="flex justify-center gap-2 mt-3">${items.map((x,i)=>'<button data-lb-dot="'+i+'" class="w-4 h-4 rounded-full '+(i===GalleryLightbox._i?'bg-sakura2':'bg-[var(--clay)]')+'"></button>').join('')}</div>
      </div>`;
      mask.classList.add('show');
    };
    GalleryLightbox._i = idx; GalleryLightbox._items = items;
    show();
    /* 事件绑定（灯箱内按钮） */
    box.onclick = ev=>{
      const t = ev.target.closest('[data-lb-close],[data-lb-prev],[data-lb-next],[data-lb-dot]');
      if(!t) return;
      if(t.hasAttribute('data-lb-close')) GalleryLightbox.close();
      else if(t.hasAttribute('data-lb-prev')){ GalleryLightbox._i=(GalleryLightbox._i-1+items.length)%items.length; show(); }
      else if(t.hasAttribute('data-lb-next')){ GalleryLightbox._i=(GalleryLightbox._i+1)%items.length; show(); }
      else if(t.hasAttribute('data-lb-dot')){ GalleryLightbox._i=+t.getAttribute('data-lb-dot'); show(); }
    };
  },
  close(){ $('#modal-mask').classList.remove('show'); }
};

/* 音符彩屑 */
function confettiNotes(){
  const host=$('#float-notes');

function toast(msg){

/* ============================================================
   全局事件委托：导航 / 播放 / 动作分发
   ============================================================ */
function initDelegation(){
  document.addEventListener('click', ev=>{
    /* 导航链接 */
    const navEl = ev.target.closest('[data-route]');
    if(navEl){ Router.go(navEl.getAttribute('data-route')); return; }
    /* 直接播放 */
    const pEl = ev.target.closest('[data-play]');
    if(pEl){ const s=SONG_MAP[pEl.getAttribute('data-play')]; if(s) Player.playSong(s); return; }
    /* Banner 控制 */
    const bn = ev.target.closest('[data-banner]');
    if(bn){ clearInterval(bannerTimer); bannerGo(bn.getAttribute('data-banner')==='prev'?-1:1); bannerTimer=setInterval(()=>bannerGo(1),5000); return; }
    const dot = ev.target.closest('[data-dot]');
    if(dot){ clearInterval(bannerTimer); bannerIdx=+dot.getAttribute('data-dot'); updateBanner(); bannerTimer=setInterval(()=>bannerGo(1),5000); return; }
    /* 灯箱 */
    const lb = ev.target.closest('[data-lightbox]');
    if(lb){ GalleryLightbox.open(lb.getAttribute('data-lightbox'), +lb.getAttribute('data-idx')); return; }
    const lbClose = ev.target.closest('[data-lb-close]');
    if(lbClose){ GalleryLightbox.close(); return; }
    /* 弹窗遮罩关闭 */
    if(ev.target.id==='modal-mask'){ GalleryLightbox.close(); Player.closeModal(); return; }
    /* 动作分发 */
    const act = ev.target.closest('[data-action]');
    if(act){ Actions[act.getAttribute('data-action')] && Actions[act.getAttribute('data-action')](act); return; }
  });
}

/* 歌词导入弹窗（用户自备歌词，仅存本机 localStorage） */
function openLyricModal(songId){
  const s = SONG_MAP[songId]; if(!s) return;
  const mask=$('#modal-mask'), box=$('#modal-box');
  const cur = LyricStore.has(songId)
    ? LyricStore.get(songId).map(l=>[l.ja,l.zh,l.ro].filter(Boolean).join(' | ')).join('\n')
    : (s.lyrics||[]).map(l=>[l.ja,l.zh,l.ro].filter(Boolean).join(' | ')).join('\n');
  box.innerHTML = `<div class="p-5">
    <div class="flex items-center justify-between"><div class="font-display text-xl">导入歌词 · ${esc(s.t)}</div>
    <button class="text-sakura2" data-lyr="close" aria-label="关闭"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="text-xs text-[var(--txt-2)] mt-2">每行一句，格式：日文 | 中文 | 罗马音（后两段可省略）。内容仅保存在你自己的浏览器，不会上传。</p>
    <textarea id="lyr-input" class="w-full h-56 mt-3 p-3 rounded-xl border border-[var(--line)] bg-transparent text-sm" placeholder="例：&#10;君と見る 景色なんて | 与你一同眺望的风景 | Kimi to miru keshiki nante">${esc(cur)}</textarea>
    <div class="flex gap-2 mt-3 justify-end">
      <button class="btn btn-ghost px-4 py-2 text-sm" data-lyr="close">取消</button>
      <button class="btn btn-berry px-5 py-2 text-sm" data-lyr="save">保存</button>
    </div></div>`;
  mask.classList.add('show');
  box.onclick = ev=>{
    const b=ev.target.closest('[data-lyr]'); if(!b) return;
    const act=b.getAttribute('data-lyr');
    if(act==='close') mask.classList.remove('show');
    else if(act==='save'){
      const lines = LyricStore.parse($('#lyr-input').value);
      LyricStore.set(songId, lines);
      mask.classList.remove('show');
      toast('已保存 '+lines.length+' 行歌词（仅本机）');
      Router.render((location.hash||'#/').slice(2)||'/');
      if(Player.song && Player.song.id===songId) renderLyricsPanel();
    }
  };
}

/* ============================================================
   键盘快捷键：空格播放暂停 / 左右切歌 / M 静音
   ============================================================ */
function initKeyboard(){
  document.addEventListener('keydown', ev=>{
    const tag=(ev.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select') return;
    if(ev.code==='Space'){ ev.preventDefault(); Player.toggle(); }
    else if(ev.key==='ArrowRight'){ Player.next(); }
    else if(ev.key==='ArrowLeft'){ Player.prev(); }
    else if(ev.key==='m'||ev.key==='M'){ Player.toggleMute(); }
  });
}
