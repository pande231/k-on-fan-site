let _ctx=null, _masterGain=null;
function getCtx(){
  if(!_ctx){
    _ctx = new (window.AudioContext||window.webkitAudioContext)();
    _masterGain = _ctx.createGain();
    _masterGain.gain.value = 0.22;
    _masterGain.connect(_ctx.destination);
  }
  return _ctx;
}
/* 由歌曲 id 派生固定音阶（保证同一首歌旋律一致，可被猜歌游戏复用） */
function melodyFor(song){
  const scales = [[0,2,4,7,9],[0,3,5,7,10],[0,2,5,7,9],[0,2,3,7,8]];
  let h=0; for(const ch of String(song.id)) h=(h*31+ch.charCodeAt(0))>>>0;
  const scale = scales[h%scales.length];
  const base = 220 + (h%5)*30; // A3 附近
  const notes = Array.from({length:16}, (_,i)=>{
    const step = (i*5 + ((h>>(i%8))&3)) % scale.length;
    return base * Math.pow(2, scale[step]/12);
  });
  return {notes, tempo: song.tempo||112};
}
/* 合成演示音：轻柔 16 音循环（attack/release≥5ms，音量克制） */
function synthStart(song){
  const ctx = getCtx(); ctx.resume();
  const {notes, tempo} = melodyFor(song);
  const beat = 60/tempo;
  let step = 0, stop=false;
  const playStep = ()=>{
    if(stop) return;
    const f = notes[step % notes.length];
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = f;
    const now = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.22, now+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now+beat*1.6);
    osc.connect(g); g.connect(_masterGain);
    osc.start(now); osc.stop(now+beat*1.8);
    /* 每 4 步加一个低音垫音 */
    if(step%4===0){
      const b = ctx.createOscillator(), bg = ctx.createGain();
      b.type='sine'; b.frequency.value = f/2;
      bg.gain.setValueAtTime(0.0001, now);
      bg.gain.linearRampToValueAtTime(0.10, now+0.02);
      bg.gain.exponentialRampToValueAtTime(0.0001, now+beat*2.5);
      b.connect(bg); bg.connect(_masterGain);
      b.start(now); b.stop(now+beat*2.6);
    }
    step++;
  };
  const timer = setInterval(playStep, beat*1000);
  playStep();
  Player._synth = {stop(){ stop=true; clearInterval(timer); }};
}
function synthStop(){ if(Player._synth){ Player._synth.stop(); Player._synth=null; } }

const Player = {
  queue:[], idx:0, mode:'order', isPlaying:false,
  song:null, _audio:null, _synth:null, _virtual:0, _dur:0, _tick:null,
  _notesTimer:null, history:[], sleepUntil:0, deskMode:false, lockShuffle:false,

  /* 从列表开始播放（shuffle=true 时使用智能乱序） */
  playQueue(list, shuffle){
    this._origQueue = list.slice();
    this.queue = list.slice();
    if(!this.queue.length){ toast('这个列表暂时没有可播放的曲目'); return; }
    if(shuffle) this.queue = smartShuffle(this.queue, null);
    this.idx = 0;
    this._load(this.queue[0]);
  },
  /* 播放单曲（在队列中则跳转，否则建立单曲队列） */
  playSong(song){
    const i = this.queue.findIndex(s=>s.id===song.id);
    if(i>=0){ this.idx=i; this._load(song); }
    else { this.queue=[song]; this.idx=0; this._load(song); }
  },
  /* 全曲库乱序 */
  shuffleAll(){
    this._origQueue = SONGS.slice();
    const list = smartShuffle(SONGS.slice(), null);
    this.queue = list; this.idx = 0;
    this._load(list[0]);
    toast('全曲库大乱斗开始！共 '+list.length+' 首 ♪');
  },
  toggle(){ this.isPlaying ? this.pause() : this.play(); },
  play(){
    if(!this.song){ const s = SONGS.find(x=>x.cat==='op') || SONGS[0]; this.playSong(s); return; }
    this.isPlaying = true;
    const el = $('#player'); el.classList.add('playing');
    if(this._audio){ this._audio.play().catch(()=>toast('浏览器阻止了自动播放，请手动点击播放')); }
    else synthStart(this.song);
    this._startTick(); this._startNotes();
    this._render();
  },
  pause(){
    this.isPlaying = false;
    $('#player').classList.remove('playing');
    if(this._audio) this._audio.pause();
    synthStop();
    this._stopTick(); this._stopNotes();
    this._render();
  },
  next(){
    if(!this.queue.length) return;
    const m = this.mode;
    if(m==='single'){ this._load(this.queue[this.idx]); return; }
    if(m==='random'){
      if(this.queue.length>1){ let n; do{ n=(Math.random()*this.queue.length)|0; }while(n===this.idx); this.idx=n; }
      this._load(this.queue[this.idx]); return;
    }
    if(m==='smart'){
      if(this.idx < this.queue.length-1){ this.idx++; this._load(this.queue[this.idx]); }
      else { const list=smartShuffle(this._origQueue||this.queue, this.song?this.song.id:null); this.queue=list; this.idx=0; this._load(list[0]); }
      return;
    }
    if(m==='loop'){ this.idx = (this.idx+1)%this.queue.length; this._load(this.queue[this.idx]); return; }
    /* order */
    if(this.idx < this.queue.length-1){ this.idx++; this._load(this.queue[this.idx]); }
    else this.pause();
  },
  prev(){
    if(!this.queue.length) return;
    if(this.mode==='random'){
      if(this.queue.length>1){ let n; do{ n=(Math.random()*this.queue.length)|0; }while(n===this.idx); this.idx=n; }
      this._load(this.queue[this.idx]); return;
    }
    if(this.mode==='order'){ if(this.idx>0){ this.idx--; this._load(this.queue[this.idx]); } return; }
    this.idx = (this.idx-1+this.queue.length)%this.queue.length;
    this._load(this.queue[this.idx]);
  },
  seek(sec){
    const t = Math.max(0, +sec||0);
    if(this._audio && !isNaN(this._audio.duration)){ this._audio.currentTime = Math.min(t, this._audio.duration); }
    this._virtual = t;
  },
  setVolume(v){
    if(_masterGain) _masterGain.gain.value = (v/100)*0.32;
    if(this._audio) this._audio.volume = (v/100)*0.45;
  },
  toggleMute(){
    this._muted = !this._muted;
    if(_masterGain) _masterGain.gain.value = this._muted?0:((($('#p-volume').value||22)/100)*0.32);
    $('#p-mute').innerHTML = (this._muted?ICONS.volmute:ICONS.vol).replace('<svg','<svg class="w-5 h-5"');
  },
  cycleMode(){
    const order=['order','loop','single','random','smart'];
    this.mode = order[(order.indexOf(this.mode)+1)%order.length];
    toast('播放模式：'+this.modeName());
    this._render();
  },
  modeName(){
    return {order:'顺序播放',loop:'列表循环',single:'单曲循环',random:'完全随机',smart:'智能乱序（推荐）'}[this.mode];
  },
  /* 载入歌曲 */
  _load(song){
    this.pause();
    /* 释放上一首的真实音频对象，避免串音 */
    if(this._audio){ try{ this._audio.pause(); this._audio.removeAttribute('src'); this._audio.load(); }catch(e){} this._audio=null; }
    this.song = song;
    this._virtual = 0; this._dur = 0;
    /* 历史记录（最近20首） */
    this.history = [song.id, ...this.history.filter(id=>id!==song.id)].slice(0,20);
    /* 音源优先级：song.audio 自填 > MEDIA.audio 映射 > PREVIEWS iTunes官方30秒试听 > 合成演示音 */
    const url = song.audio || (MEDIA.audio && MEDIA.audio[song.id]) || (PREVIEWS[song.id] || '');
    if(url){
      this._audio = new Audio();
      this._audio.src = url;
      this._audio.preload = 'auto';
      this._audio.volume = (($('#p-volume').value||22)/100)*0.45;
      this._audio.onended = ()=>this.next();
      this._audio.onloadedmetadata = ()=>{ if(this._audio && isFinite(this._audio.duration) && this._audio.duration>0){ this._dur = this._audio.duration; this._render(); } };
      this._audio.onerror = ()=>{ toast('试听加载失败，已切换为演示合成音'); this._audio=null; if(this.song===song) synthStart(song); };
    }
    this._render();
    this.play();
  },
  /* UI 渲染 */
  _render(){
    const s = this.song;
    $('#p-title').textContent = s ? s.t : '未在播放';
    $('#p-sub').textContent = s ? (s.unit+' · '+s.tZh+((!s.audio && PREVIEWS[s.id])?' · 官方30秒试听':'')) : '放課後ティータイム 応援站';
    $('#p-toggle').innerHTML = this.isPlaying ? ICONS.pause : ICONS.play;
    $('#p-mode').textContent = this.modeName();
    const fav = Playlists.isFav(s? s.id:'');
    $('#p-fav').innerHTML = (fav?ICONS.heartF:ICONS.heart).replace('<svg','<svg class="w-5 h-5"');
    $('#p-fav').classList.toggle('on', fav);
    if(s){
      const dur = this._dur || s.dur;
      $('#p-progress').max = dur;
      $('#p-dur').textContent = fmtD(dur);
    }
    this.renderQueue(); this.renderHistory(); this.renderPlaylists();
    if(this.deskMode) this._updateDeskLyric();
  },
  /* 进度 tick（合成音虚拟进度 / 真实音频 realtime） */
  _startTick(){
    this._stopTick();
    this._tick = setInterval(()=>{
      if(!this.isPlaying) return;
      let t;
      if(this._audio && !isNaN(this._audio.duration)) t = this._audio.currentTime;
      else { this._virtual += 0.5; t = this._virtual; }
      /* 真实音频/试听由 onended 触发切歌；仅合成演示音用虚拟进度自动切 */
      if(!this._audio && t >= this.song.dur){ this.next(); return; }
      $('#p-progress').value = Math.min(t, this._dur || this.song.dur);
      $('#p-cur').textContent = fmtD(t);
      this._highlightLyric(t);
      /* 定时关闭 */
      if(this.sleepUntil && Date.now() >= this.sleepUntil){ this.sleepUntil=0; this.pause(); toast('定时关闭：播放已停止'); }
    }, 500);
  },
  _stopTick(){ if(this._tick){ clearInterval(this._tick); this._tick=null; } },
  /* 播放时音符上浮 */
  _startNotes(){
    this._stopNotes();
    if(this._notesTimer) return;
    this._notesTimer = setInterval(()=>{
      if(!this.isPlaying) return;
      const host=$('#float-notes'); if(!host) return;
      const s=document.createElement('span');
      s.className='float-note';
      s.style.left=(4+Math.random()*90)+'%'; s.style.bottom='120px';
      s.innerHTML = ['♪','♫','♬','♩'][(Math.random()*4)|0];
      host.appendChild(s); setTimeout(()=>s.remove(), 3000);
    }, 1400);
  },
  _stopNotes(){ if(this._notesTimer){ clearInterval(this._notesTimer); this._notesTimer=null; } },
  /* 歌词当前行高亮（按进度估算行位置） */
  _highlightLyric(t){
    const s=this.song; if(!s) return;
    const L = LyricStore.get(s.id); if(!L.length) return;
    const lineIdx = Math.min(L.length-1, Math.floor(t / (s.dur/L.length)));
    $$('.lyric-line').forEach((l,i)=>{
      l.classList.toggle('active', i===lineIdx);
      l.classList.toggle('past', i<lineIdx);
    });
    const panel = $('#panel-lyrics .lyric-line.active');
    if(panel) panel.scrollIntoView({block:'center', behavior:'smooth'});
    if(this.deskMode) this._updateDeskLyric(lineIdx);
  },
  _updateDeskLyric(lineIdx){
    const s=this.song; if(!s) return;
    const i = lineIdx==null ? null : lineIdx;
    const L = LyricStore.get(s.id);
    const line = (i==null && L.length)? L[0] : (i==null? null : L[i]);
    const box=$('#desk-lyrics');
    if(line){ box.querySelector('.dl-ja').textContent = line.ja; box.querySelector('.dl-zh').textContent = line.zh; box.style.display='block'; }

      : '<div class="text-sm text-[#C9BBA6] p-4 text-center">队列为空，去音乐中心点首歌吧。</div>';

      : '<div class="text-sm text-[#C9BBA6] p-4 text-center">还没有播放记录（最近 20 首）。</div>';

/* ---- 智能乱序算法 ----
   规则：① 保证近10首播放过的曲目不重复
        ② 同一角色歌曲不连续 ③ 同一分类不连续 ④ 快慢节奏穿插 */
function smartShuffle(list, lastId){
  const avoid = new Set(Player.history.slice(0,10));
  const pool = list.filter(s=>s.id!==lastId && !avoid.has(s.id));
  const base = pool.length>=2 ? pool : list.slice();
  const out=[];
  let prev=null;
  while(base.length){
    /* 候选打分：跳过同角色/同分类，优先慢-快穿插 */
    const scored = base.map(s=>{
      let score = Math.random()*3;
      if(prev){
        if((s.chars||[]).some(c=>(prev.chars||[]).includes(c))) score -= 6;
        if(s.cat===prev.cat) score -= 4;
        if(prev.tempo && s.tempo) score += (prev.tempo>=140 && s.tempo<140 || prev.tempo<140 && s.tempo>=140) ? 2.5 : 0;
      }
      return {s, score};
    }).sort((a,b)=>b.score-a.score);
    const pick = scored[0].s;
    out.push(pick);
    base.splice(base.indexOf(pick),1);
    prev=pick;
  }
  return out;
}

   ⑩ 歌单 / 收藏 PLAYER 扩展（Playlists）
   ============================================================ */
const Playlists = {
  pl:{}, favs:[],
  load(){
    try{
      const d=JSON.parse(localStorage.getItem('kon-playlists')||'{}');
      this.pl = d.pl||{}; this.favs = d.favs||[];
    }catch(e){ this.pl={}; this.favs=[]; }
  },
  save(){ try{ localStorage.setItem('kon-playlists', JSON.stringify({pl:this.pl, favs:this.favs})); }catch(e){} },
  isFav(id){ return this.favs.includes(id); },
  toggleFav(id){
    if(this.isFav(id)) this.favs = this.favs.filter(x=>x!==id);
    else { this.favs.unshift(id); }
    this.save(); Player._render();
    toast(this.isFav(id)?'已收藏':'已取消收藏');
  },
  addSongs(songs){
    if(!Object.keys(this.pl).length) this.pl['我的歌单']=[];
    const name = Object.keys(this.pl)[0];
    for(const s of songs) if(!this.pl[name].includes(s.id)) this.pl[name].push(s.id);
    this.save(); Player._render();
    toast('已加入歌单「'+name+'」');
  },
  newPlaylist(){
    const name = prompt('新歌单名称：');
    if(name && name.trim()){
      this.pl[name.trim()] = [];
      this.save(); Player._render(); toast('已创建歌单「'+name.trim()+'」');
    }
  },
  delPlaylist(name){
    if(confirm('删除歌单「'+name+'」？')){
      delete this.pl[name]; this.save(); Player._render();
    }
  },
  export(){
    const blob = new Blob([JSON.stringify({pl:this.pl, favs:this.favs},null,2)], {type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='kon-playlists.json'; a.click();
    toast('歌单已导出（kon-playlists.json）');
  },
  importFrom(file){
    const fr=new FileReader();
    fr.onload=()=>{ try{ const d=JSON.parse(fr.result); this.pl=d.pl||this.pl; this.favs=d.favs||this.favs; this.save(); Player._render(); toast('歌单导入成功'); }catch(e){ toast('导入失败：JSON 格式不正确'); } };
    fr.readAsText(file);
  }
};

  $('#p-fav').addEventListener('click', ()=>{ if(Player.song) Playlists.toggleFav(Player.song.id); else toast('先选一首歌吧'); });
  $('#p-mute').addEventListener('click', ()=>Player.toggleMute());
  $('#p-volume').addEventListener('input', ev=>Player.setVolume(+ev.target.value));
  $('#p-progress').addEventListener('input', ev=>Player.seek(+ev.target.value));
  $('#p-list').addEventListener('click', ()=>{ $('#player').classList.toggle('collapsed'); Player._render(); });
  $('#player-expand').addEventListener('click', ()=>{ $('#player').classList.toggle('collapsed'); Player._render(); });
  $('#p-desk').addEventListener('click', ()=>{
    Player.deskMode = !Player.deskMode;
    $('#p-desk').classList.toggle('on', Player.deskMode);
    if(!Player.deskMode) $('#desk-lyrics').style.display='none';
    else Player._updateDeskLyric();
  });
  $('#p-sleep').addEventListener('click', ()=>openSleepModal());
  /* 面板 tab */
  $$('#player-panel .panel-tab').forEach(t=>t.addEventListener('click', ()=>{
    $$('#player-panel .panel-tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    const p=t.getAttribute('data-panel');
    $$('#player-panel [id^="panel-"]').forEach(x=>x.classList.add('hidden'));
    $('#panel-'+p).classList.remove('hidden');
    if(p==='lyrics') renderLyricsPanel();
  }));
  /* 队列点击（委托到 #player） */
  $('#player').addEventListener('click', ev=>{
    const q = ev.target.closest('[data-qidx]');
    if(q){ Player.idx=+q.getAttribute('data-qidx'); Player._load(Player.queue[Player.idx]); return; }
    const h = ev.target.closest('[data-history]');
    if(h){ const s=SONG_MAP[h.getAttribute('data-history')]; if(s) Player.playSong(s); return; }
    const a = ev.target.closest('[data-action]');
    if(a && ['restore-order','new-playlist','export-playlists','del-pl','play-pl','import-playlists'].includes(a.getAttribute('data-action'))){
      const act=a.getAttribute('data-action');
      if(act==='restore-order'){
        if(Player._origQueue && Player._origQueue.length){
          const cur=Player.song;
          Player.queue=Player._origQueue.slice();
          Player.idx=cur?Player.queue.findIndex(s=>s.id===cur.id):0;
          if(Player.idx<0) Player.idx=0;
        }
        toast('已恢复原序（乱序状态解除）'); Player._render();
      }
      else if(act==='new-playlist') Playlists.newPlaylist();
      else if(act==='export-playlists') Playlists.export();
      else if(act==='del-pl') Playlists.delPlaylist(a.getAttribute('data-pl'));
      else if(act==='play-pl'){ const ids=Playlists.pl[a.getAttribute('data-pl')]||[]; Player.playQueue(ids.map(id=>SONG_MAP[id]).filter(Boolean), false); }
      else if(act==='import-playlists'){ $('#import-file').click(); }
      return;
    }
  });
  /* 导入文件绑定改在 renderPlaylists 中动态注入时完成（#import-file 为运行时生成） */
}
/* ============================================================
   歌词存储 LyricStore
   - 站内只内置「节选」；用户可导入自己的完整歌词（存 localStorage，仅本机可见）
   - 格式：每行「日文 | 中文 | 罗马音」，后两段可省略
   ============================================================ */
const LyricStore = {
  data:{},
  load(){ try{ this.data = JSON.parse(localStorage.getItem('kon-lyrics')||'{}'); }catch(e){ this.data={}; } },
  save(){ try{ localStorage.setItem('kon-lyrics', JSON.stringify(this.data)); }catch(e){} },
  has(id){ return !!(this.data[id] && this.data[id].length); },
  get(id){
    if(this.data[id] && this.data[id].length) return this.data[id];
    const s = SONG_MAP[id];
    return (s && s.lyrics) || [];
  },
  set(id, lines){ this.data[id] = lines; this.save(); },
  clear(id){ delete this.data[id]; this.save(); },
  /* 解析用户粘贴的文本 -> [{ja,zh,ro}] */
  parse(text){
    return String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
      const p = line.split(/\s*[|｜\t]\s*/);
      return { ja: p[0]||'', zh: p[1]||'', ro: p[2]||'' };
    });
  }
};

/* 定时关闭弹窗 */
function openSleepModal(){
  const mask=$('#modal-mask'), box=$('#modal-box');
  box.innerHTML = `<div class="p-5">
    <div class="flex items-center justify-between"><div class="font-display text-xl">定时关闭</div><button class="text-sakura2" data-sleep="off" aria-label="关闭"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="text-sm text-[var(--txt-2)] mt-2">到时间后自动停止播放。</p>
    <div class="grid grid-cols-2 gap-3 mt-4">
      ${[10,20,30,60].map(m=>`<button class="btn btn-berry px-4 py-3" data-sleep="${m}">${m} 分钟后</button>`).join('')}
      <button class="btn btn-ghost px-4 py-3" data-sleep="0">取消定时</button>
    </div></div>`;
  mask.classList.add('show');
  box.onclick = ev=>{
    const b = ev.target.closest('[data-sleep]');
    if(!b) return;

    else { Player.sleepUntil = Date.now()+ (+m)*60000; mask.classList.remove('show'); toast('将在 '+m+' 分钟后停止播放'); }
  };
}

        const now=ctx.currentTime;
        g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(0.2,now+0.012); g.gain.exponentialRampToValueAtTime(0.0001,now+beat*1.5);

      {ja:'タイガー！',zh:'Tiger!',f:523},{ja:'ファイヤー！',zh:'Fire!',f:587},
      {ja:'サイバー！',zh:'Cyber!',f:659},{ja:'ファイバー！',zh:'Fiber!',f:698},
      {ja:'ダイバー！',zh:'Diver!',f:784},{ja:'バイバー！',zh:'Viber!',f:880},
      {ja:'ジャージャー！',zh:'Jya-Jya!',f:988},{ja:'よっしゃいくぞ！',zh:'Yossha ikuzo!',f:1046}
    ];
    let color=COLORS[0];
    app.innerHTML = `<div class="kcard p-6">
      <div class="rounded-2xl p-6 mb-4 text-center" style="background:linear-gradient(160deg,#2B231E,#4A3F35)">
        <div class="text-xs text-[#C9BBA6] mb-3">荧光棒应援舞台</div>

        <div class="mt-4 flex justify-center gap-2 flex-wrap">${COLORS.map((c,i)=>`<button class="w-7 h-7 rounded-full border-2 ${i===0?'border-white':'border-transparent'}" data-color="${c}" style="background:${c}" aria-label="荧光棒颜色${i+1}"></button>`).join('')}</div>
        <button class="btn btn-berry px-6 py-2.5 text-sm mt-4" id="call-mix">▶ 完整 MIX 连击</button>
      </div>
      <div class="text-xs text-[var(--txt-2)] mb-2">点击口号（带音效）：</div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${CALLS.map((c,i)=>`<button class="btn btn-cream px-3 py-3 text-sm" data-call="${i}" style="flex-direction:column;gap:2px"><span class="font-jp">${c.ja}</span><span class="text-[10px] text-[var(--txt-2)]">${c.zh}</span></button>`).join('')}</div>

/* 打call音效：短促方波（独立于播放器主音量） */
function callTone(freq){
  try{
    const ctx=getCtx(); ctx.resume();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    const now=ctx.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.16, now+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.22);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now+0.24);
  }catch(e){}
}
function gradeGuess(score){
  if(score>=8) return '传说级猜歌王！绝对是老粉中的老粉。';
  if(score>=5) return '资深粉丝！听前奏就能认出来。';
  if(score>=3) return '合格轻音部成员，继续加油！';
  return '新人部员：快去音乐中心补课吧～';
}
function examRank(score){
  if(score===10) return '武道馆ライブ達成！全知全能の神（满级大佬）';
  if(score>=8) return '放課後ティータイム正規メンバー（资深部员）';
  if(score>=6) return 'さわ子先生認定（准部员）';
  if(score>=4) return '軽音部部員（新人）';
  return '部員見習い（还在门口张望）';
}

/* ============================================================
   ⑫ 初始化 INIT
   ============================================================ */
function initStatsCounter(){
  const els=$$('[data-count]');
  if(!els.length) return;
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const el=en.target, target=+el.getAttribute('data-count');
      let cur=0; const step=Math.max(1, Math.round(target/40));
      const t=setInterval(()=>{
        cur+=step;
        if(cur>=target){ cur=target; clearInterval(t); }
        el.textContent=cur;
      }, 24);
      io.unobserve(el);
    });
  },{threshold:.3});
  els.forEach(el=>io.observe(el));
}
function hideLoader(){
  const l=$('#loader'); if(l) l.classList.add('hide');
  setTimeout(()=>{ if(l) l.remove(); }, 600);
}
function init(){
  Playlists.load();
  LyricStore.load();
  initNav();
  initDelegation();
  initKeyboard();
  initHash();
  initPlayerUI();
  Player._render();
  /* 注：initStatsCounter() 由 PostRender.init() 在首页渲染后调用——
     此处 #view 尚未渲染，[data-count] 还不存在，提前调用会静默失效 */
  /* 加载动画：onload 优先，兜底 1.6s */
  if(document.readyState==='complete') hideLoader();
  else window.addEventListener('load', hideLoader);
  setTimeout(hideLoader, 1600);
  /* 首次路由（默认首页） */
  Router.render((location.hash||'#/').slice(1)||'/');
  /* 自动播放：尝试直接播放，浏览器阻止时等首次交互 */
  setTimeout(()=>{
    const tryPlay = () => {
      try {
        if(!Player.song){ const s = SONGS.find(x=>x.cat==='op') || SONGS[0]; Player.playSong(s); }
        else Player.play();
      } catch(e){}
    };
    tryPlay();
    /* 500ms 后若仍未播放，显示轻量提示并等首次交互 */
    setTimeout(()=>{
      if(!Player.isPlaying){
        toast('浏览器限制自动播放，点击页面任意位置即可开始音乐 ♪');
        const onFirst = () => {
          document.removeEventListener('click', onFirst);
          document.removeEventListener('keydown', onFirst);
          tryPlay();
        };
        document.addEventListener('click', onFirst);
        document.addEventListener('keydown', onFirst);
      }
    }, 600);
  }, 1200);
}
/* 启动 */
init();
</script>
